# Plumb default configuration
# ============================
# This file is shipped with the distribution as a baseline you
# can edit. Run with:
#
#   bin/sast-scan -c conf/default-config.yaml -i path/to/your/src
#
# All fields are optional — anything you omit falls back to the
# built-in default documented in doc/usage/CLI.md. Both camelCase
# (cgStrategy) and snake_case (cg-strategy) keys are accepted;
# camelCase wins when both are present.
#
# To make the package small, no examples/ tree is shipped. The
# baseline config below intentionally leaves `inputs` empty so
# the user has to set -i on the command line; if you prefer
# config-driven inputs, add an `inputs:` block here.

# ---- output ----
# Default is console-on-stdout. Uncomment + edit to
# write a file. The default-config intentionally omits
# `output.path` so stdout gets the findings — users who
# want a file add `output.path: build/sast.ndjson` here
# or pass `-o build/sast.ndjson` on the command line.
# output:
#   path: build/sast.ndjson
#   format: ndjson             # console | ndjson

# ---- on-disk IR cache ----
# Uncomment to enable. R-? — when on, the parse + translate
# stage writes per-source TAC to <outputDir>/cache/programs/
# and a merged view to <outputDir>/cache/merged.tac, so
# re-running the same scan skips translation. Schema
# bumps on `ir version` invalidate automatically.
# outputDir: build/plumb-out
# cacheMode: readwrite         # off | read | write | readwrite
maxParallelism: 4             # parse+translate parallelism; 0 = nCPU-1

# The default call-graph strategy is `global`.
# `cgStrategy: vta` is a TU-local strategy that drops
# cross-file call resolution, which is what catches most
# cross-TU taint patterns. `RcgStrategyTest:34` already
# asserts `global` as the default. Trade-offs:
#
#   global — DEFAULT. Cross-TU signature lookup via
#            `GlobalTACStore`. Slowest, but the only mode
#            that catches cross-TU taint cases.
#   vta    — Variable Type Analysis, TU-local, precise.
#   cha    — Class Hierarchy Analysis, fast / over-approx.
#            Use for very large codebases.
#   rta    — Rapid Type Analysis, between cha and vta.
#   1cfa   — 1-CFA context-sensitive. Slow.
#   stub   — direct calls only. Tests / debug only.
#   cached:<name>:<path>  — wrap any of the above with a
#                            disk cache at <path>.
cgStrategy: global

# ---- rule switches (uncomment + edit to opt in/out) ----
# rules:
#   enabled:                   # force-enable (even if default-off)
#     - bu-0401-weak-crypto
#   disabled:                  # force-disable
#     - STYLE_SYSTEM_OUT

# ---- aggressiveness ----
# The `aggressiveness:` key is not read. Per-rule firing is driven by
# `checks.<rule>: {enabled: true/false}` in this YAML, or `--rule <id>` on
# the CLI. A config that still mentions `aggressiveness:` gets a warning at
# startup (see ConfigLoader).

# ---- checker families ----
# All true by default. Set any to false to disable.
# `aiDedup: true` means the AI FP-reducer agent reviews
# findings for that rule family (the LLM gets the rule
# prompt + the finding's source context + dataflow trace
# and returns TP/FP/UNKNOWN). The verifier tags findings
# in the NDJSON output as `ai_verdict` + `ai_reason`.
checks:
  # --- Taint master switch (the unified taint checkers) ---
  taint: true
  # --- Style / structural checks ---
  style: true
  # --- Numeric / safety taint ---
  divByZero:           {enabled: true,  aiDedup: true}
  resourceLeak:        {enabled: true,  aiDedup: true}
  nullDeref:           {enabled: true,  aiDedup: true}
  hardcodedCred:       {enabled: true,  aiDedup: true}
  intOverflow:         {enabled: true,  aiDedup: true}
  intUnderflow:        {enabled: true,  aiDedup: true}
  arrayBounds:         {enabled: true,  aiDedup: true}
  weakCrypto:          {enabled: true,  aiDedup: true}
  insecureRandom:      {enabled: true,  aiDedup: true}
  predictableSeed:     {enabled: true,  aiDedup: true}
  predictableKey:      {enabled: true,  aiDedup: true}
  staticApiKey:        {enabled: true,  aiDedup: true}
  insecureComms:       {enabled: true,  aiDedup: true}
  corsMisconfig:       {enabled: true,  aiDedup: true}
  insecureCookie:      {enabled: true,  aiDedup: true}
  badShift:            {enabled: true,  aiDedup: true}
  infiniteLoop:        {enabled: true,  aiDedup: true}
  constantCondition:   {enabled: true,  aiDedup: true}
  sensitiveDataLeak:   {enabled: true,  aiDedup: true}
  fieldHardcodedPassword: {enabled: true, aiDedup: true}
  missingAuthorization:   {enabled: true, aiDedup: true}
  missingInputValidation: {enabled: true, aiDedup: true}
  informationExposure:     {enabled: true, aiDedup: true}
  uncheckedReturn:         {enabled: true, aiDedup: true}
  incorrectReturn:         {enabled: false, aiDedup: true} # style-ish
  threadRun:               {enabled: false, aiDedup: false} # style
  stringEquality:           {enabled: true,  aiDedup: true}
  catchGeneric:            {enabled: false, aiDedup: false} # style
  obsoleteFunction:        {enabled: true,  aiDedup: true}
  tryCatchFinally:         {enabled: true,  aiDedup: false}
  offByOne:                {enabled: true,  aiDedup: true}
  equalsCalledOnNull:      {enabled: true,  aiDedup: true}
  compareWithSelf:         {enabled: true,  aiDedup: true}
  xxe:                     {enabled: true,  aiDedup: true}
  returnFromFinally:       {enabled: true,  aiDedup: false}
  emptyCatchHandler:       {enabled: true,  aiDedup: true}
  iteratorConcurrentModification: {enabled: true, aiDedup: true}
  collectionSelfReference:  {enabled: true,  aiDedup: false}
  uncaughtExceptionPropagator:    {enabled: true,  aiDedup: false}
  uncheckedLoopCondition:   {enabled: true,  aiDedup: true}
  uncontrolledMemAlloc:    {enabled: true,  aiDedup: true}
  numericTruncation:       {enabled: true,  aiDedup: true}
  # CWE-400: Thread.sleep + unbounded for-loop (plumb-dfa ResourceExhaustionChecker)
  resourceExhaustion:      {enabled: true,  aiDedup: true}
  # errorMessageInfoLeak and commentInfoLeak are parsed so old configs keep
  # loading, but they do NOT switch the AST checkers off: those are
  # registered unconditionally by AstCheckerRegistry.builtins(). Turn them
  # off with `rules.disabled` and the AST rule id instead:
  #   rules:
  #     disabled:
  #       - ast-error-error-message-info-leak
  #       - ast-style-comment-info-leak
  # The two DfaChecker ports below are structural checks that read the IR
  # directly and do not propagate data flow.
  bigDecimalDoubleConstructor: {enabled: true, aiDedup: true}  # CWE-682
  defaultEncoding:             {enabled: true, aiDedup: true}  # CWE-176
  # The `loose:` key is not read. A config that still mentions it is
  # ignored, not an error. The strict `plumb.numeric.*` /
  # `plumb.boundary.*` rules and the `plumb.ast.*` rules carry the
  # coverage.

# ---- style thresholds ----
# `style.methodLengthThreshold` is not read. plumb-style has its own
# hard-coded 80-line limit. When plumb-style grows per-checker thresholds,
# they will be added here under the `style:` block.

# ---- R-? AI augmentation layer (plumb-ai) ----
# FP-reducer agent only (CLI: --ai-dedup / ai.dedup: true).
# At scan-finish time, every finding whose rule id is
# listed under `ai.dedupRules` (or every rule if the
# list is empty) is sent to the LLM with the rule's
# prompt + the source context + the dataflow trace.
# The LLM returns {"verdict":"TP|FP|UNKNOWN",
# "reason":"..."}. The verdict lands in the NDJSON
# output as `ai_verdict` / `ai_reason`. When
# `ai.dropOnAiFp: true` FP findings are dropped from
# the report entirely.
#
# The `ai:` block has five keys that are not read. A config that still
# mentions them gets a warning at startup, not an error:
#   * ai.enabled    (master switch) — `--ai-dedup` itself is
#                   the switch; the `enabled` field is ignored.
#   * ai.scan       (bug scanner / `--ai-scan`) — the CLI flag
#                   and the YAML key are both absent.
#   * ai.contextLines — not read; the runner uses its
#                   own `extractSourceContext(f, 3)`.
#   * ai.rulePromptsDir (YAML only) — the CLI flag
#                   `--rule-prompts-dir` is the supported
#                   path; the YAML key is not read.
#   * ai.sendAstContext — not read.
#
# The package deliberately does NOT use Spring-AI to keep
# the jar footprint small. The agent speaks
# any OpenAI-compatible chat-completion API (OpenAI,
# Azure, Ollama, vLLM, LocalAI) or Anthropic /v1/messages.
#
# SECURITY: do NOT commit a real apiKey. Use the ${ENV_VAR}
# syntax so the key is read from the environment at
# startup. The runtime never logs the key.
ai:
  dedup: false                      # FP reducer (CLI: --ai-dedup)
  dropOnAiFp: false                 # drop FP findings vs keep them with ai_verdict=FP
  dedupRules: []                    # empty = every rule is reviewed; populate to narrow
  provider: openai                  # openai | anthropic | openai_compatible
  baseUrl: https://api.openai.com
  apiKey: ${OPENAI_API_KEY}         # read from env at startup
  model: gpt-4o-mini                # any model name your endpoint accepts
  header:                           # optional extra request header
  timeoutSeconds: 30
  maxConcurrent: 4                  # parallel dedup requests
  temperature: 0.0                  # deterministic verdict (FP reducer)
