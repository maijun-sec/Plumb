      - '^Runtime\.loadLibrary(/\d+)?'

# ===== EL_INJECTION (CWE-94) =====
  # Sink methods that evaluate an EL expression. A tainted expression
  # allows attacker-controlled method invocation / property access.
# accept both FQN and short-form callee sigs.
  el.sinks:
    cwe: CWE-94
    severity: CRITICAL
    patterns:
