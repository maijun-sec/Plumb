  cleartext-tx.sinks:
    cwe: CWE-319
    severity: HIGH
    patterns:
      - '^java\.io\.PrintWriter\.print(/\d+)?'
      - '^java\.io\.PrintWriter\.println(/\d+)?'
      - '^java\.io\.PrintWriter\.write(/\d+)?'
      - '^java\.io\.PrintWriter\.append(/\d+)?'
      - '^java\.io\.PrintWriter\.format(/\d+)?'
      - '^java\.io\.PrintWriter\.printf(/\d+)?'
      - '^java\.io\.OutputStream\.write(/\d+)?'
      - '^java\.io\.OutputStream\.print(/\d+)?'
      - '^java\.io\.OutputStream\.println(/\d+)?'
      - '^java\.io\.FilterOutputStream\.write(/\d+)?'
      - '^java\.io\.BufferedOutputStream\.write(/\d+)?'
      - '^java\.io\.DataOutputStream\.write(/\d+)?'
      - '^java\.io\.OutputStreamWriter\.write(/\d+)?'
      - '^java\.io\.Writer\.write(/\d+)?'
      - '^java\.io\.BufferedWriter\.write(/\d+)?'
      - '^java\.io\.PrintStream\.write(/\d+)?'
      - '^java\.net\.Socket\.getOutputStream(/\d+)?'
      - '^java\.net\.URLConnection\.getOutputStream(/\d+)?'
      - '^java\.net\.HttpURLConnection\.getOutputStream(/\d+)?'
      - '^java\.nio\.channels\.SocketChannel\.write(/\d+)?'
      - '^java\.nio\.channels\.WritableByteChannel\.write(/\d+)?'
    by_language:
      csharp:
        # A .NET write onto an unencrypted channel. `NetworkStream.Write` is
        # the one that matters: it is the raw socket write, and a tainted
        # value written to it goes out in the clear.
        #
        # `StreamWriter.Write` is included because the .NET `StreamWriter`
        # hierarchy is what application code writes through -- and its
        # receiver is the stream, so the value is argument 0.
        #
