# ===== JSP_DYNAMIC_INCLUDE (CWE-829) =====
  # Sink methods that include a JSP fragment at runtime. A tainted
  # path allows attacker-controlled include of arbitrary content.
# accept both FQN and short-form callee sigs.
  jsp-include.sinks:
    cwe: CWE-829
