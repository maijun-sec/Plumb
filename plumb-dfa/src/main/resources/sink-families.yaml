      - '^Expression\.getValue(/\d+)?'
      - '^org\.springframework\.expression\.Expression\.setValue(/\d+)?'
      - '^Expression\.setValue(/\d+)?'

# ===== JCR_INJECTION (CWE-94) =====
  # Sink methods that execute a JCR (JSR-170) query. A tainted
  # query or path allows attacker-controlled traversal / Xpath-like
  # injection.
# accept both FQN and short-form callee sigs.
  jcr.sinks:
