        arg_index: 1
      - pattern: '^PasswordAuthentication\.<init>(/\d+)?'
        arg_index: 1
      - pattern: '^javax\.security\.auth\.kerberos\.KerberosKey\.<init>(/\d+)?'
        arg_index: 1
      - pattern: '^KerberosKey\.<init>(/\d+)?'
        arg_index: 1

  external.config.sinks:
