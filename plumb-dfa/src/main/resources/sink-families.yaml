# sink-families.yaml
#
# Maps a sink family (e.g. sql.sinks) to a set of
# function-name patterns. A pattern is a Java regex
# matched against the callee signature (e.g.
# "java.sql.Statement#execute(Ljava.lang.String;)V").
#
# Used by SinkFamilyRegistry to classify call sites
# at analysis time. A single taint walk that flows
# into a sink call site can then be tagged with the
# CWE family corresponding to that sink.
#
# Adding a new sink family:
#   families:
#     my-project.sinks:
#       cwe: CWE-XXX
#       severity: HIGH
#       patterns:
#         - "^com\\.example\\.DangerousSink#doIt"
#
# Disabling a family (without removing the entry):
#   families:
#     sql.sinks:
#       cwe: CWE-89
#       severity: CRITICAL
#       enabled: false
#       patterns: [...]
#
# Note: severity is a string label
# (INFO/LOW/MEDIUM/HIGH/CRITICAL); cwe is "CWE-NNN"
# or null for non-CWE-tagged families (e.g. taint
# sources).
#
# The Go tables
# -------------
#
# A Go call site is written `owner.method/arity`, where the owner is
# the receiver's type for a method and the PACKAGE'S IMPORT PATH for
# a package-level function: `database/sql.DB.Exec/2` is a method of
# the `database/sql` package's `DB` type, and `os.Getenv/1` is a
# function of the `os` package. The import path is the whole path,
# not the directory name, so `path/filepath.Join` and `path.Join` stay
# apart.
#
# `arg_index` is the USER-VISIBLE argument index. The engine adds the
# receiver slot itself: a method call puts the receiver at args[0], so
# the catalogue's index 0 is the engine's args[1]. A package-level
# function puts the package path at args[0] as well, so its first
# real argument is also at args[1] and the same index means the same
# thing for both.
#
# A Go function whose LAST parameter is variadic counts that parameter
# ONCE in the arity, but the front end puts each variadic value in its
# own argument slot. So `exec.Command(name, arg...)` is `os/exec.Command/2`
# and its values sit at user index 0, 1, 2, ... -- which is why the
# command table lists a span of positions rather than one.
#
# Every symbol named in a Go table was MEASURED: the Go front end was
# run over a probe that calls it, and the callee signature the front
# end emitted was read back out of the TAC. A symbol the front end
# cannot produce is a pattern that never fires, so the table names
# what the front end actually emits.
#
# One Go-specific case is worth naming: `os.Open` is listed next to
# `os.OpenFile` even though the first calls the second. A front end
# that resolved a standard-library wrapper to the function it wraps
# would not need the entry; this one does not inline the standard
# library, so the wrapper has to be named on its own.

families:
  url.sinks:
    cwe: CWE-918
    severity: HIGH
    languages: ['java', 'kotlin', 'scala', 'go']
    patterns:
      - '^java\.net\.URL\.<init>(/\d+)?'
      - '^java\.net\.URL\.openStream(/\d+)?'
      - '^java\.net\.URL\.openConnection(/\d+)?'
      - '^java\.net\.URLConnection\.getInputStream(/\d+)?'
      - '^java\.net\.HttpURLConnection\.<init>(/\d+)?'
      - '^java\.net\.URLConnection\.connect(/\d+)?'
      - '^org\.apache\.http\.client\.HttpClient\.execute(/\d+)?'
      - '^org\.apache\.http\.impl\.client\.HttpClients\.createDefault/0'
    by_language:
      go:
        - pattern: '^net/url\.Parse(/\d+)?'
          arg_index: 0
  sensitive.exfil.sinks:
    cwe: CWE-200
    severity: HIGH
    languages: ['java', 'kotlin', 'scala']
    patterns:
      - '^java\.util\.logging\.Logger\.info(/\d+)?'
      - '^java\.util\.logging\.Logger\.warn(/\d+)?'
      - '^java\.util\.logging\.Logger\.error(/\d+)?'
      - '^java\.util\.logging\.Logger\.severe(/\d+)?'
      - '^java\.util\.logging\.Logger\.debug(/\d+)?'
      - '^java\.util\.logging\.Logger\.log(/\d+)?'
      - '^java\.lang\.System\.out(/\d+)?'
      - '^java\.lang\.System\.err(/\d+)?'
      - '^java\.io\.PrintStream\.print(/\d+)?'
      - '^java\.io\.PrintStream\.println(/\d+)?'
      - '^java\.io\.PrintWriter\.print(/\d+)?'
      - '^java\.io\.PrintWriter\.println(/\d+)?'
      - '^org\.slf4j\.Logger\.info(/\d+)?'
      - '^org\.slf4j\.Logger\.warn(/\d+)?'
      - '^org\.slf4j\.Logger\.error(/\d+)?'
      - '^org\.slf4j\.Logger\.debug(/\d+)?'

  pii.exfil.sinks:
    cwe: CWE-359
    severity: HIGH
    languages: ['java', 'kotlin', 'scala']
    patterns:
      - '^java\.util\.logging\.Logger\.info(/\d+)?'
      - '^java\.util\.logging\.Logger\.warn(/\d+)?'
      - '^java\.util\.logging\.Logger\.error(/\d+)?'
      - '^java\.util\.logging\.Logger\.severe(/\d+)?'
      - '^java\.util\.logging\.Logger\.debug(/\d+)?'
      - '^java\.util\.logging\.Logger\.log(/\d+)?'
      - '^java\.lang\.System\.out(/\d+)?'
      - '^java\.lang\.System\.err(/\d+)?'
      - '^java\.io\.PrintStream\.print(/\d+)?'
      - '^java\.io\.PrintStream\.println(/\d+)?'
      - '^java\.io\.PrintWriter\.print(/\d+)?'
      - '^java\.io\.PrintWriter\.println(/\d+)?'
      - '^org\.slf4j\.Logger\.info(/\d+)?'
      - '^org\.slf4j\.Logger\.warn(/\d+)?'
      - '^org\.slf4j\.Logger\.error(/\d+)?'
      - '^org\.slf4j\.Logger\.debug(/\d+)?'
      - '^java\.lang\.reflect\.Constructor\.newInstance(/\d+)?'

  format-string.sinks:
    cwe: CWE-134
    severity: MEDIUM
    languages: ['java', 'kotlin', 'scala', 'go', 'typescript', 'javascript', 'php']
    patterns:
      - '^java\.lang\.String\.format(/\d+)?'
      - '^java\.io\.PrintStream\.printf(/\d+)?'
      - '^java\.io\.PrintStream\.format(/\d+)?'
      - '^java\.io\.PrintWriter\.format(/\d+)?'
      - '^java\.io\.PrintWriter\.printf(/\d+)?'
      - '^java\.util\.Formatter\.format(/\d+)?'
      - '^java\.util\.logging\.Logger\.log(/\d+)?'
      - '^java\.lang\.System\.out\.format(/\d+)?'
      - '^java\.lang\.System\.out\.printf(/\d+)?'
      - '^java\.lang\.System\.err\.format(/\d+)?'
      - '^java\.lang\.System\.err\.printf(/\d+)?'
      - '^java\.lang\.System\.format(/\d+)?'
      - '^java\.lang\.System\.printf(/\d+)?'

    by_language:
      go:
        - pattern: '^fmt\.Printf(/\d+)?'
          arg_index: 0
        - pattern: '^fmt\.Sprintf(/\d+)?'
          arg_index: 0
        - pattern: '^fmt\.Fprintf(/\d+)?'
          arg_index: 1
      typescript,javascript:
      # The format string is the FIRST argument; the values after it are
      # what the format describes. The module may be spelled with or
      # without the 'node:' prefix the runtime prefers.
      - pattern: '^(?:node:)?util\.format\b(/\d+)?'
        arg_index: 0
      php:
      # The format string is the FIRST argument of all four.
      - pattern: '^\\(printf|sprintf|vprintf|vsprintf)\b(/\d+)?'
        arg_index: 0
  log.sinks:
    cwe: CWE-117
    severity: MEDIUM
    languages: ['java', 'kotlin', 'scala', 'go', 'typescript', 'javascript', 'python3', 'php']
    patterns:
      - pattern: '^java\.util\.logging\.Logger\.info(/\d+)?'
      - pattern: '^java\.util\.logging\.Logger\.warning(/\d+)?'
      - pattern: '^java\.util\.logging\.Logger\.severe(/\d+)?'
      - pattern: '^java\.util\.logging\.Logger\.fine(/\d+)?'
      - pattern: '^java\.util\.logging\.Logger\.finer(/\d+)?'
      - pattern: '^java\.util\.logging\.Logger\.finest(/\d+)?'
      - pattern: '^java\.util\.logging\.Logger\.config(/\d+)?'
      - pattern: '^java\.util\.logging\.Logger\.log(/\d+)?'
        arg_index: 1
      - pattern: '^org\.slf4j\.Logger\.info(/\d+)?'
      - pattern: '^org\.slf4j\.Logger\.warn(/\d+)?'
      - pattern: '^org\.slf4j\.Logger\.error(/\d+)?'
      - pattern: '^org\.slf4j\.Logger\.debug(/\d+)?'
      - pattern: '^org\.slf4j\.Logger\.trace(/\d+)?'
      - pattern: '^java\.lang\.System\.Logger\.log(/\d+)?'
        arg_index: 1
    by_language:
      go:
        - pattern: '^log\.Print(/\d+)?'
          arg_index: 0
        - pattern: '^log\.Printf(/\d+)?'
          arg_index: [0, 1]
        - pattern: '^log\.Println(/\d+)?'
          arg_index: 0
        - pattern: '^log\.Fatal(/\d+)?'
          arg_index: 0
        - pattern: '^log\.Fatalf(/\d+)?'
          arg_index: [0, 1]
        - pattern: '^log\.Fatalln(/\d+)?'
          arg_index: 0
        - pattern: '^log\.Panic(/\d+)?'
          arg_index: 0
        - pattern: '^log\.Panicf(/\d+)?'
          arg_index: [0, 1]
        - pattern: '^log\.Panicln(/\d+)?'
          arg_index: 0
        - pattern: '^log\.Logger\.Print(/\d+)?'
          arg_index: 0
        - pattern: '^log\.Logger\.Printf(/\d+)?'
          arg_index: [0, 1]
        - pattern: '^log\.Logger\.Println(/\d+)?'
          arg_index: 0
      typescript,javascript:
        # The console of the runtime. The receiver is the console object and
        # the message is the first user argument; console.log takes several
        # arguments and prints them all, so either can carry the taint.
        #
        # ArkTS is deliberately absent: measured against its side car, the
        # owner of `console.log` there is the FILE's module name and not the
        # Console type, so there is no name to point a pattern at.
        - pattern: '^Console\.(log|info|warn|error|debug|trace)\b(/\d+)?'
          arg_index: [0, 1]
      python3:
        - pattern: '^logging\.(debug|info|warning|error|critical|exception)\b(/\d+)?'
          arg_index: 0
      php:
        # error_log writes the message; syslog's message is the SECOND
        # argument, after the priority.
        - pattern: '^\\error_log\b(/\d+)?'
          arg_index: 0
        - pattern: '^\\syslog\b(/\d+)?'
          arg_index: 1
  format.sinks:
    cwe: CWE-134
    severity: HIGH
    languages: ['java', 'kotlin', 'scala']
    patterns:
      - '^java\.lang\.String\.format(/\d+)?'
      - '^java\.io\.PrintStream\.printf(/\d+)?'
      - '^java\.io\.PrintStream\.format(/\d+)?'
      - '^java\.io\.PrintWriter\.format(/\d+)?'
      - '^java\.util\.Formatter\.format(/\d+)?'
      - '^java\.util\.logging\.Logger\.info(/\d+)?'
      - '^java\.util\.logging\.Logger\.warning(/\d+)?'
      - '^java\.util\.logging\.Logger\.severe(/\d+)?'
      - '^java\.util\.logging\.Logger\.log(/\d+)?'
      - '^org\.slf4j\.Logger\.info(/\d+)?'
      - '^org\.slf4j\.Logger\.warn(/\d+)?'
      - '^org\.slf4j\.Logger\.error(/\d+)?'
      - '^org\.slf4j\.Logger\.debug(/\d+)?'

  header.sinks:
    cwe: CWE-93
    severity: MEDIUM
    languages: ['java', 'kotlin', 'scala', 'php']
    default_arg_index: 1
    patterns:
      - pattern: '^javax\.servlet\.http\.HttpServletResponse\.setHeader(/\d+)?'
      - pattern: '^javax\.servlet\.http\.HttpServletResponse\.addHeader(/\d+)?'
      - pattern: '^javax\.servlet\.http\.HttpServletResponse\.sendError(/\d+)?'
      - pattern: '^javax\.servlet\.http\.HttpServletResponse\.setStatus(/\d+)?'
        arg_index: -1
      - pattern: '^javax\.servlet\.http\.HttpServletResponse\.sendRedirect(/\d+)?'
        arg_index: 0
      - pattern: '^javax\.servlet\.http\.HttpServletResponse\.encodeURL(/\d+)?'
        arg_index: 0
      - pattern: '^javax\.servlet\.http\.HttpServletResponse\.encodeRedirectURL(/\d+)?'
        arg_index: 0
      - pattern: '^javax\.servlet\.http\.HttpServletResponse\.addCookie(/\d+)?'
        arg_index: 0
      - pattern: '^javax\.servlet\.http\.Cookie\.<init>/\d+'
        arg_index: 1
      - pattern: '^org\.springframework\.http\.ResponseEntity\.<init>/\d+'
        arg_index: 1
      - pattern: '^org\.springframework\.http\.HttpHeaders\.set(/\d+)?'
      - pattern: '^org\.springframework\.http\.HttpHeaders\.add(/\d+)?'
    by_language:
      php:
        # header() takes the whole header line in its FIRST argument;
        # the name and the value are one string there.
        - pattern: '^\\header\b(/\d+)?'
          arg_index: 0
        # mail() writes its SECOND argument into the Subject header.
        - pattern: '^\\mail\b(/\d+)?'
          arg_index: 1
  mem-alloc.sinks:
    cwe: CWE-789
    severity: HIGH
    languages: ['java', 'kotlin', 'scala']
    patterns:
      - '^java\.lang\.StringBuffer\.<init>/\d+'
      - '^java\.lang\.StringBuilder\.<init>/\d+'
      - '^java\.io\.ByteArrayOutputStream\.<init>/\d+'
      - '^java\.io\.CharArrayWriter\.<init>/\d+'
      - '^java\.io\.CharArrayReader\.<init>/\d+'
      - '^java\.io\.ByteArrayInputStream\.<init>/\d+'
      - '^java\.util\.Vector\.<init>/\d+'
      - '^java\.util\.ArrayList\.<init>/\d+'
      - '^java\.util\.HashMap\.<init>/\d+'
      - '^java\.util\.HashSet\.<init>/\d+'
      - '^java\.util\.Hashtable\.<init>/\d+'
      - '^java\.lang\.String\.<init>/\d+'
      - '^java\.lang\.reflect\.Array\.newInstance(/\d+)?'

  ssl.sinks:
