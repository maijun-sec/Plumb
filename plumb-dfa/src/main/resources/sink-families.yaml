# sink-families.yaml
#
# Maps a sink family (e.g. sql.sinks) to a set of
# function-name patterns. A pattern is a Java regex
# matched against the callee signature (e.g.
# "java.sql.Statement#execute(Ljava.lang.String;)V").
#
# Used by SinkFamilyRegistry to classify call sites
# at analysis time. A single taint walk that flows
# into a sink call site can then be tagged with the
# CWE family corresponding to that sink.
#
# Adding a new sink family:
#   families:
#     my-project.sinks:
#       cwe: CWE-XXX
#       severity: HIGH
#       patterns:
#         - "^com\\.example\\.DangerousSink#doIt"
#
# Disabling a family (without removing the entry):
#   families:
#     sql.sinks:
#       cwe: CWE-89
#       severity: CRITICAL
#       enabled: false
#       patterns: [...]
#
# Note: severity is a string label
# (INFO/LOW/MEDIUM/HIGH/CRITICAL); cwe is "CWE-NNN"
# or null for non-CWE-tagged families (e.g. taint
# sources).

families:
  taint.sources.web:
    patterns:
      - '^javax\.servlet\.http\.HttpServletRequest\.getParameter(/\d+)?'
      - '^javax\.servlet\.http\.HttpServletRequest\.getHeader(/\d+)?'
      - '^javax\.servlet\.http\.HttpServletRequest\.getCookies(/\d+)?'
      - '^javax\.servlet\.http\.HttpServletRequest\.getQueryString(/\d+)?'
      - '^io\.undertow\.server\.HttpServerExchange\.getQueryParameters(/\d+)?'
      - '^org\.springframework\.http\.HttpHeaders\.getFirst(/\d+)?'

  taint.sources.io:
    patterns:
      - '^java\.io\.InputStream\.read(/\d+)?'
      - '^java\.io\.Reader\.read(/\d+)?'
      - '^java\.io\.BufferedReader\.readLine(/\d+)?'
      - '^java\.util\.Scanner\.next(/\d+)?'
      - '^java\.util\.Scanner\.nextLine(/\d+)?'
      - '^java\.nio\.channels\.ReadableByteChannel\.read(/\d+)?'

  taint.sources.network:
    patterns:
      - '^java\.net\.Socket\.getInputStream(/\d+)?'
      - '^java\.net\.DatagramSocket\.receive(/\d+)?'
      - '^java\.net\.URLConnection\.getInputStream(/\d+)?'

  taint.sources.console:
    patterns:
      - '^java\.io\.Console\.readLine(/\d+)?'
      - '^java\.lang\.System\.console(/\d+)?'
    by_language:
      kotlin:
        - pattern: '^kotlin\.io\.readLine(/\d+)?'
          arg_index: 0
        - pattern: '^kotlin\.io\.readln(/\d+)?'
          arg_index: 0
      scala:
        - pattern: '^scala\.io\.StdIn\$\$anon\$1\.readLine(/\d+)?'
          arg_index: 0
        - pattern: '^scala\.io\.StdIn\.readLine(/\d+)?'
          arg_index: 0

  taint.sources.env:
    patterns:
      - '^java\.lang\.System\.getenv(/\d+)?'
      - '^java\.lang\.System\.getProperty(/\d+)?'
    by_language:
      kotlin:
        - pattern: '^kotlin\.system\.getenv(/\d+)?'
