      - '^HttpsURLConnection\.setDefaultHostnameVerifier(/\d+)?'
      - '^javax\.net\.ssl\.HttpsURLConnection\.setHostnameVerifier(/\d+)?'
      - '^HttpsURLConnection\.setHostnameVerifier(/\d+)?'
      - '^javax\.net\.ssl\.SSLContext\.init(/\d+)?'
      - '^SSLContext\.init(/\d+)?'
      - '^javax\.net\.ssl\.SSLContext\.getInstance(/\d+)?'
      - '^SSLContext\.getInstance(/\d+)?'
      - '^org\.apache\.http\.conn\.ssl\.SSLConnectionSocketFactory\.<init>(/\d+)?'
      - '^SSLConnectionSocketFactory\.<init>(/\d+)?'
      - '^org\.apache\.http\.ssl\.SSLContexts\.custom(/\d+)?'
      - '^SSLContexts\.custom(/\d+)?'

  jni.sinks:
    cwe: CWE-114
    severity: CRITICAL
    languages: ['java', 'kotlin', 'scala']
    patterns:
      - '^java\.lang\.System\.load(/\d+)?'
      - '^System\.load(/\d+)?'
      - '^java\.lang\.System\.loadLibrary(/\d+)?'
      - '^System\.loadLibrary(/\d+)?'
      - '^java\.lang\.Runtime\.load(/\d+)?'
      - '^Runtime\.load(/\d+)?'
      - '^java\.lang\.Runtime\.loadLibrary(/\d+)?'
      - '^Runtime\.loadLibrary(/\d+)?'

  jcr.sinks:
    cwe: CWE-94
    severity: HIGH
    languages: ['java', 'kotlin', 'scala']
    patterns:
      - '^javax\.jcr\.Query\.execute(/\d+)?'
      - '^Query\.execute(/\d+)?'
      - '^javax\.jcr\.Workspace\.query(/\d+)?'
      - '^Workspace\.query(/\d+)?'
      - '^javax\.jcr\.Session\.save(/\d+)?'
      - '^Session\.save(/\d+)?'
      - '^javax\.jcr\.Node\.getNode(/\d+)?'
      - '^Node\.getNode(/\d+)?'
      - '^javax\.jcr\.Node\.getProperty(/\d+)?'
      - '^Node\.getProperty(/\d+)?'
      - '^javax\.jcr\.Item\.remove(/\d+)?'
      - '^Item\.remove(/\d+)?'

  jsp-include.sinks:
    cwe: CWE-829
    severity: CRITICAL
    languages: ['java', 'kotlin', 'scala']
    patterns:
      - '^org\.apache\.jasper\.runtime\.PageContextImpl\.include(/\d+)?'
      - '^PageContextImpl\.include(/\d+)?'
      - '^javax\.servlet\.RequestDispatcher\.include(/\d+)?'
      - '^RequestDispatcher\.include(/\d+)?'
      - '^javax\.servlet\.jsp\.PageContext\.include(/\d+)?'
      - '^PageContext\.include(/\d+)?'
      - '^org\.apache\.tiles\.request\.render\.Renderer\.render(/\d+)?'
      - '^Renderer\.render(/\d+)?'
  session.sinks:
    cwe: CWE-384
    severity: HIGH
    languages: ['java', 'kotlin', 'scala']
    patterns:
      - '^javax\.servlet\.http\.HttpServletRequest\.changeSessionId(/\d+)?'
      - '^HttpServletRequest\.changeSessionId(/\d+)?'
      - '^javax\.servlet\.http\.HttpSession\.changeSessionId(/\d+)?'
      - '^HttpSession\.changeSessionId(/\d+)?'
      - '^javax\.servlet\.http\.HttpServletResponse\.setHeader(/\d+)?'
      - '^HttpServletResponse\.setHeader(/\d+)?'
      - '^javax\.servlet\.http\.HttpServletResponse\.addHeader(/\d+)?'
      - '^HttpServletResponse\.addHeader(/\d+)?'
      - '^org\.apache\.shiro\.session\.Session\.setId(/\d+)?'
      - '^Session\.setId(/\d+)?'
      - '^org\.apache\.shiro\.web\.session\.HttpServletSession\.setId(/\d+)?'
      - '^HttpServletSession\.setId(/\d+)?'

  random.sinks:
