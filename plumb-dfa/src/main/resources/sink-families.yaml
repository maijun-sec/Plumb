# ===== TRUST_BOUNDARY_VIOLATION (CWE-501) =====
  # Sink locations where tainted data crosses into a storage
  # location the rest of the application trusts — typically a
  # session, request attribute, or static cache. The CWE describes
  # this as "data flowing into a data structure or context that is
  # often assumed to be trustworthy".
# accept both FQN and short-form callee sigs.
  trust-boundary.sinks:
    cwe: CWE-501
    severity: MEDIUM
    patterns:
      - '^javax\.servlet\.http\.HttpSession\.setAttribute(/\d+)?'
      - '^HttpSession\.setAttribute(/\d+)?'
      - '^javax\.servlet\.http\.HttpServletRequest\.setAttribute(/\d+)?'
      - '^HttpServletRequest\.setAttribute(/\d+)?'
      - '^javax\.servlet\.ServletContext\.setAttribute(/\d+)?'
      - '^ServletContext\.setAttribute(/\d+)?'
      - '^java\.util\.concurrent\.ConcurrentHashMap\.put(/\d+)?'
      - '^ConcurrentHashMap\.put(/\d+)?'
      - '^java\.util\.HashMap\.put(/\d+)?'
      - '^HashMap\.put(/\d+)?'
      - '^java\.util\.Hashtable\.put(/\d+)?'
      - '^Hashtable\.put(/\d+)?'
      - '^java\.util\.Map\.put(/\d+)?'
      - '^Map\.put(/\d+)?'

# ===== SESSION_FIXATION (CWE-384) =====
  # Sink methods that establish a new session token. Tainted data
  # flowing into these lets the attacker pin the victim's
  # session to a value they control, then ride the session
  # after the victim logs in (classic session fixation).
# accept both FQN and short-form callee sigs.
  session.sinks:
    cwe: CWE-384
    severity: HIGH
    patterns:
      - '^javax\.servlet\.http\.HttpServletRequest\.changeSessionId(/\d+)?'
      - '^HttpServletRequest\.changeSessionId(/\d+)?'
      - '^javax\.servlet\.http\.HttpSession\.changeSessionId(/\d+)?'
      - '^HttpSession\.changeSessionId(/\d+)?'
      - '^javax\.servlet\.http\.HttpServletResponse\.setHeader(/\d+)?'
      - '^HttpServletResponse\.setHeader(/\d+)?'
      - '^javax\.servlet\.http\.HttpServletResponse\.addHeader(/\d+)?'
      - '^HttpServletResponse\.addHeader(/\d+)?'
      - '^org\.apache\.shiro\.session\.Session\.setId(/\d+)?'
      - '^Session\.setId(/\d+)?'
      - '^org\.apache\.shiro\.web\.session\.HttpServletSession\.setId(/\d+)?'
      - '^HttpServletSession\.setId(/\d+)?'

# ===== INSECURE_RANDOM (CWE-330) =====
  # Sink methods that produce a non-cryptographic random value
  # (java.util.Random / Math.random). Tainted "seed" arguments
  # are not in scope here — the issue is the choice of PRNG in
  # a security-sensitive context. The rule's brief is
  # precise: "cryptographically weak PRNGs used in security-
  # sensitive contexts". We attach this sink to taint as a
  # standalone family: any value read from these methods is
  # treated as an "insecure-random-source" so the
  # SensitiveDataLeak-style downstream checks can fire if
  # the value flows into a session id, token, etc.
  random.sinks:
    cwe: CWE-330
    severity: MEDIUM
    patterns:
      - '^java\.util\.Random\.next(/\d+)?'
      - '^java\.util\.Random\.nextInt(/\d+)?'
      - '^java\.util\.Random\.nextLong(/\d+)?'
      - '^java\.util\.Random\.nextDouble(/\d+)?'
      - '^java\.util\.Random\.nextFloat(/\d+)?'
      - '^java\.util\.Random\.nextBoolean(/\d+)?'
      - '^java\.util\.Random\.nextBytes(/\d+)?'
      - '^java\.util\.concurrent\.ThreadLocalRandom\.next(/\d+)?'
      - '^java\.util\.concurrent\.ThreadLocalRandom\.nextInt(/\d+)?'
      - '^java\.util\.concurrent\.ThreadLocalRandom\.nextLong(/\d+)?'
      - '^java\.util\.concurrent\.ThreadLocalRandom\.nextDouble(/\d+)?'
      - '^java\.lang\.Math\.random(/\d+)?'
      - '^org\.apache\.commons\.lang3\.RandomUtils\.next(/\d+)?'

# ===== JAVA_CODE_INJECTION (CWE-94) =====
  # Sink methods that evaluate Java source / bytecode / scripts.
  # Tainted data flowing into these is a direct RCE vector:
  # ScriptEngine.eval, GroovyShell.evaluate, SpEL, OGNL (already
  # covered by the expression-injection family), etc.
# accept both FQN and short-form callee sigs.
  code-execution.sinks:
    cwe: CWE-94
    severity: CRITICAL
    patterns:
      - '^javax\.script\.ScriptEngine\.eval(/\d+)?'
      - '^ScriptEngine\.eval(/\d+)?'
      - '^groovy\.lang\.GroovyShell\.evaluate(/\d+)?'
      - '^GroovyShell\.evaluate(/\d+)?'
      - '^groovy\.lang\.GroovyClassLoader\.parseClass(/\d+)?'
      - '^GroovyClassLoader\.parseClass(/\d+)?'
      - '^org\.codehaus\.groovy\.control\.CompilationUnit\.compile(/\d+)?'
      - '^CompilationUnit\.compile(/\d+)?'
      - '^org\.springframework\.scripting\.bsh\.BSHLikesGroovy\.eval(/\d+)?'
      - '^BSHLikesGroovy\.eval(/\d+)?'
      - '^jdk\.nashorn\.api\.scripting\.NashornScriptEngine\.eval(/\d+)?'
      - '^NashornScriptEngine\.eval(/\d+)?'
      - '^java\.beans\.Expression\.getValue(/\d+)?'
      - '^Expression\.getValue(/\d+)?'
      - '^java\.beans\.Statement\.execute(/\d+)?'
      - '^Statement\.execute(/\d+)?'
      - '^java\.beans\.XMLDecoder\.<init>(/\d+)?'
      - '^XMLDecoder\.<init>(/\d+)?'
      - '^java\.io\.ObjectInputStream\.readObject(/\d+)?'
      - '^ObjectInputStream\.readObject(/\d+)?'

  # ===== R7 PLAINTEXT_PASSWORD_SINK (CWE-256) =====
  # Sink methods that consume a credential from
  # an external source without sanitisation. The
  # classic Juliet pattern is:
  #   password = properties.getProperty("password");
  #   DriverManager.getConnection(url, user, password);
  # i.e. the password slot of DriverManager.getConnection
  # gets a file-sourced value directly. The
  # taint-style DBCredentialSinkChecker (extends
  # TaintedCheckerBase) handles this with the
  # standard `plumb.taint.untrusted-source` source
  # family. The HardCodedPasswordSinkChecker (R6)
  # is a DFA-style sibling that catches the
  # literal-hard-coded variant.
  #
  # The TAC CALL builder prepends the receiver to
  # ins.args, so the DriverManager.getConnection
  # static call (no real "this") has args[0] =
  # "this" placeholder, args[1] = url (Java arg 0),
  # args[2] = user (Java arg 1), args[3] = password
  # (Java arg 2). The framework's universal +1
  # offset maps sinkArgumentIndex(2) -> argIdx 3.
  db.credential.sinks:
    cwe: CWE-256
    severity: CRITICAL
    # family-wide default arg index. The
    # DriverManager.getConnection static calls
    # are 3-arg (url, user, password); password
    # is Java arg index 2. The framework adds
    # +1 for the receiver placeholder at
    # args[0], so the family default is 2.
    # Without this, ConfigLoader's asInt
    # default of 0 silently mis-targets
    # DriverManager.getConnection to args[1]
    # (the url) instead of args[3] (the
    # password).
    default_arg_index: 2
    patterns:
      - '^java\.sql\.DriverManager\.getConnection(/\d+)?'
      - '^DriverManager\.getConnection(/\d+)?'
      - '^javax\.sql\.DataSource\.getConnection(/\d+)?'
      - '^DataSource\.getConnection(/\d+)?'
      - '^org\.springframework\.jdbc\.datasource\.DriverManagerDataSource\.<init>(/\d+)?'
      # PasswordAuthentication.<init>(String user, char[] password).
      # NEW instructions pass the ctor arg list directly
      # (no receiver +1 offset), so arg_index 1 is the
      # char[] password in TAC args. The per-pattern
      # arg_index overrides the family default_arg_index
      # (2) because ctor's java arg 1 is char[] password,
      # not java arg 2.
      - pattern: '^java\.net\.PasswordAuthentication\.<init>(/\d+)?'
        arg_index: 1
      - pattern: '^PasswordAuthentication\.<init>(/\d+)?'
        arg_index: 1
      # KerberosKey.<init>(KerberosPrincipal, char[] password, int).
      # arg 1 is the char[] password; arg 2 is the key
      # type (algorithm index, not sensitive).
      - pattern: '^javax\.security\.auth\.kerberos\.KerberosKey\.<init>(/\d+)?'
        arg_index: 1
      - pattern: '^KerberosKey\.<init>(/\d+)?'
        arg_index: 1
      # PasswordAuthentication.<init>(String user, char[] password).
      # NEW instructions pass the ctor arg list directly
      # (no receiver +1 offset), so arg_index 1 is the
      # char[] password in TAC args.
      - pattern: '^java\.net\.PasswordAuthentication\.<init>(/\d+)?'
        arg_index: 1
      - pattern: '^PasswordAuthentication\.<init>(/\d+)?'
        arg_index: 1
      # KerberosKey.<init>(KerberosPrincipal, char[] password, int).
      # arg 1 is the char[] password; arg 2 is the key
      # type (algorithm index, not sensitive).
      - pattern: '^javax\.security\.auth\.kerberos\.KerberosKey\.<init>(/\d+)?'
        arg_index: 1
      - pattern: '^KerberosKey\.<init>(/\d+)?'
        arg_index: 1

  # external.config.sinks (CWE-15). System /
  # configuration setters that should not be called
  # with attacker-controlled values.
  external.config.sinks:
    cwe: CWE-15
    severity: CRITICAL
    patterns:
      - '^java\.lang\.System\.setProperty(/\d+)?'
      - '^System\.setProperty(/\d+)?'
      - '^java\.sql\.Connection\.setCatalog(/\d+)?'
      - '^Connection\.setCatalog(/\d+)?'
      - '^java\.util\.Locale\.setDefault(/\d+)?'
      - '^Locale\.setDefault(/\d+)?'
      - '^java\.util\.TimeZone\.setDefault(/\d+)?'
      - '^TimeZone\.setDefault(/\d+)?'
      - '^java\.net\.URL\.setURLStreamHandlerFactory(/\d+)?'
      - '^URL\.setURLStreamHandlerFactory(/\d+)?'
      - '^javax\.swing\.UIManager\.setLookAndFeel(/\d+)?'
      - '^UIManager\.setLookAndFeel(/\d+)?'
      - '^java\.sql\.DriverManager\.setLogStream(/\d+)?'
      - '^DriverManager\.setLogStream(/\d+)?'
      - '^java\.sql\.DriverManager\.setLogWriter(/\d+)?'
      - '^DriverManager\.setLogWriter(/\d+)?'

  # ===== cleartext-tx sinks (CWE-319) =====
  # General-purpose taint-style sink family for data
  # that flows into a network-channel write. The
  # canonical Juliet pattern is
  #   new PrintWriter(socket.getOutputStream(), true).println(data)
  # but the rule is broader: ANY tainted value written
  # via PrintWriter / OutputStream / Writer / to a
  # Socket's output stream is a CWE-319 candidate.
  # The AI prompt filters FP (e.g. writing to a local
  # log file or System.out that is NOT a network
  # channel). The pattern uses substring regex
  # matching, so family patterns that match overloads
  # like PrintWriter.print(String),
  # PrintWriter.println(int) etc. are all captured by
  # the `^.../(\d+)?` trailing.
  cleartext-tx.sinks:
    cwe: CWE-319
    severity: HIGH
    patterns:
      - '^java\.io\.PrintWriter\.print(/\d+)?'
      - '^java\.io\.PrintWriter\.println(/\d+)?'
      - '^java\.io\.PrintWriter\.write(/\d+)?'
      - '^java\.io\.PrintWriter\.append(/\d+)?'
      - '^java\.io\.PrintWriter\.format(/\d+)?'
      - '^java\.io\.PrintWriter\.printf(/\d+)?'
      - '^java\.io\.OutputStream\.write(/\d+)?'
      - '^java\.io\.OutputStream\.print(/\d+)?'
      - '^java\.io\.OutputStream\.println(/\d+)?'
      - '^java\.io\.FilterOutputStream\.write(/\d+)?'
      - '^java\.io\.BufferedOutputStream\.write(/\d+)?'
      - '^java\.io\.DataOutputStream\.write(/\d+)?'
      - '^java\.io\.OutputStreamWriter\.write(/\d+)?'
      - '^java\.io\.Writer\.write(/\d+)?'
      - '^java\.io\.BufferedWriter\.write(/\d+)?'
      - '^java\.io\.PrintStream\.write(/\d+)?'
      - '^java\.net\.Socket\.getOutputStream(/\d+)?'
      - '^java\.net\.URLConnection\.getOutputStream(/\d+)?'
      - '^java\.net\.HttpURLConnection\.getOutputStream(/\d+)?'
      - '^java\.nio\.channels\.SocketChannel\.write(/\d+)?'
      - '^java\.nio\.channels\.WritableByteChannel\.write(/\d+)?'

