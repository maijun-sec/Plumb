# R208 — checkers.yaml
#
# Per-checker configuration. A checker is enabled by
# default; set `enabled: false` to disable.
#
# Adding a custom checker (one you wrote and added to
# the classpath):
#   checkers:
#     MyProjectSqlSink:
#       enabled: true
#       severity: CRITICAL
#       class: com.example.MyCustomSqlSinkChecker
#       cwe: CWE-89
#       context_depth: 2
#       sink_family: sql.sinks
#       taint_domain: MIXED

checkers:
  DivideByZero:
    enabled: true
    severity: HIGH
    cwe: CWE-369
    context_depth: 2
    path_sensitivity: full
    description: "CWE-369: division or modulo by zero"
    class: org.plumb.dfa.checkers.taint.DivByZeroChecker
  IntegerOverflow:
    enabled: true
    severity: MEDIUM
    cwe: CWE-190
    context_depth: 2
    path_sensitivity: full
    description: "CWE-190: integer overflow / wrap"
    class: org.plumb.dfa.checkers.taint.IntOverflowChecker
  NullDereference:
    enabled: true
    severity: HIGH
    cwe: CWE-476
    context_depth: 1
    path_sensitivity: full
    description: "CWE-476: null pointer dereference"
    class: org.plumb.dfa.checkers.taint.NullDerefChecker
  ResourceLeak:
    enabled: true
    severity: MEDIUM
    cwe: CWE-404
    context_depth: 2
    path_sensitivity: full
    description: "CWE-404/459: resource opened but not closed"
    class: org.plumb.dfa.checkers.taint.ResourceLeakChecker
  SensitiveDataLeak:
    enabled: true
    severity: CRITICAL
    cwe: CWE-532
    context_depth: 3
    path_sensitivity: full
    taint_domain: MIXED
    description: "CWE-532: sensitive data flows to sink"
    class: org.plumb.dfa.checkers.taint.SensitiveDataLeakChecker
  UncheckedReturn:
    enabled: true
    severity: MEDIUM
    cwe: CWE-252
    context_depth: 1
    description: "CWE-252: unchecked return value"
    # R-812 Batch 3: migrated to plumb-style AST.
    # class: org.plumb.dfa.checkers.UncheckedReturnChecker
    class: org.plumb.style.security.UncheckedReturnCheck
  # R527 P0-Fix: InfiniteLoopChecker / BadShiftChecker removed
  # — the implementations don't exist in plumb-dfa.
  # They will be re-added when the corresponding checker
  # classes are created (currently only C/C++ versions
  # in legacy plumb-dfa; porting them to Java is out of
  # scope for the Coverity Java AST/DFA roadmap).
  ConstantCondition:
    enabled: true
    severity: LOW
    cwe: CWE-570
    description: "CWE-570/571: branch condition is a compile-time constant"
    class: org.plumb.dfa.checkers.taint.LiteralBooleanConditionChecker
  # R-812 audit cleanup (2026-10-14): UninitNonnullDfa migrated
  # to plumb-style (org.plumb.style.quality.UninitNonnullCheck,
  # CWE-457). The plumb-style AST version covers the same
  # coverage as the DFA half via constructor body
  # FieldDeclaration + AssignExpr walk.
  # R541-DA: DFA-based ORM_LOAD_NULL_CHECK. Catches load
  # + null-check that AST misses when the null check
  # happens after aliasing or several statements later.
  OrmLoadNullCheckDfa:
    enabled: true
    severity: LOW
    cwe: CWE-252
    context_depth: 1
    path_sensitivity: full
    description: "CWE-252: load result compared to null after aliasing (DFA)"
    class: org.plumb.dfa.checkers.controlflow.OrmLoadNullCheckDfaChecker
    aggressiveness: medium
  # R542-DA: DFA-based ORM_UNNECESSARY_GET. Catches the
  # cross-method "find result never used in content
  # access" case that the AST version can't track.
  OrmUnnecessaryGetDfa:
    enabled: true
    severity: LOW
    cwe: CWE-252
    context_depth: 1
    description: "CWE-252: Session.get/find result not used in content access (DFA)"
    class: org.plumb.dfa.checkers.controlflow.OrmUnnecessaryGetDfaChecker
    aggressiveness: medium
  # R543-DA: DFA-based ORM_LOST_UPDATE. Catches the
  # cross-method "entity persisted via helper chain"
  # case that the AST version can't see (it only
  # checks the immediate function body for direct
  # persist/save/merge calls).
  OrmLostUpdateDfa:
    enabled: true
    severity: MEDIUM
    cwe: CWE-459
    context_depth: 1
    description: "CWE-459: transient entity mutated but not persisted, even via helper (DFA)"
    class: org.plumb.dfa.checkers.controlflow.OrmLostUpdateDfaChecker
    aggressiveness: medium
  # R560-DA: DFA-based SINGLETON_RACE. Catches the
  # cross-method field-access race that the AST
  # version can't see (it only inspects one method
  # at a time).
  SingletonRaceDfa:
    # R-813 (2026-10-14): disabled by default — plumb-style
    # SingletonRaceCheck (org.plumb.style.concurrency) covers
    # the same CWE-366 with better precision. Set to true
    # to enable the DFA implementation (which inspects more
    # methods but is noisier on real codebases).
    enabled: false
    severity: HIGH
    cwe: CWE-366
    context_depth: 1
    description: "CWE-366: field read+write across multiple methods in a singleton (DFA)"
    class: org.plumb.dfa.checkers.controlflow.SingletonRaceDfaChecker
    aggressiveness: medium
  # R561-DA: DFA-based SERVLET_ATOMICITY. Catches
  # getAttribute/setAttribute on the same key across
  # different methods.
  ServletAtomicityDfa:
    # R-813 (2026-10-14): disabled by default — plumb-style
    # ServletAtomicityCheck (org.plumb.style.concurrency) covers
    # the same CWE-362 with better precision. Set to true
    # to enable the DFA implementation.
    enabled: false
    severity: HIGH
    cwe: CWE-362
    context_depth: 1
    description: "CWE-362: getAttribute/setAttribute on the same key across methods (DFA)"
    class: org.plumb.dfa.checkers.controlflow.ServletAtomicityDfaChecker
    aggressiveness: medium
  # R712 — boundary constraint checkers. Each is a
  # concrete subclass of BoundaryConstraintChecker
  # (Range lattice + GuardStore + Z3 implication)
  # so the rules fire separately for CWE-190 / -191
  # / -369 / -129. Always enabled (cheap — only
  # fires on arithmetic / array ops); per-CWE YAML
  # whitelist decides which actually reports.
  BoundaryOverflow:
    enabled: true
    severity: HIGH
    cwe: CWE-190
    description: "R712: CWE-190 integer overflow via range + Z3 constraint"
    class: org.plumb.dfa.checkers.boundary.OverflowConstraintChecker
  BoundaryUnderflow:
    enabled: true
    severity: HIGH
    cwe: CWE-191
    description: "R712: CWE-191 integer underflow via range + Z3 constraint"
    class: org.plumb.dfa.checkers.boundary.UnderflowConstraintChecker
  BoundaryDivZero:
    enabled: true
    severity: HIGH
    cwe: CWE-369
    description: "R712: CWE-369 div/mod-by-zero via range + Z3 constraint"
    class: org.plumb.dfa.checkers.boundary.DivZeroConstraintChecker
  BoundaryArrayBounds:
    enabled: true
    severity: HIGH
    cwe: CWE-129
    description: "R712: CWE-129 array out-of-bounds via range + Z3 constraint"
    class: org.plumb.dfa.checkers.boundary.ArrayBoundsConstraintChecker
