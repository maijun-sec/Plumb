# checkers.yaml
#
# Per-checker configuration. A checker is enabled by
# default; set `enabled: false` to disable.
#
# THE LANGUAGES A CHECKER APPLIES TO
#
# Every checker declares `languages:` -- the languages its
# mechanism can see. A run that selected one language loads
# only the checkers that name it, so `--language csharp`
# loads the C# rules and none of the Java ones.
#
#   languages: [all]
#       The checker has no language-specific mechanism, so
#       it applies to EVERY language -- including one added
#       after this file was written. Spelling the languages
#       out one by one would make a new language load ZERO
#       checkers the day it arrives.
#
#   languages: [java, kotlin, scala]
#       The checker is JVM-shaped by its own code (a
#       hardcoded java.lang.* symbol, a JavaParser AST, a
#       JVM framework), so it does not apply to C#.
#
# The scope is the INTERSECTION of two things: the RULE says
# which languages the defect class is expressed in, and this
# CONFIGURATION says which languages the checker can see. A
# checker whose rule names every language but whose
# configuration names [java] is still Java-only.
#
# Adding a custom checker (one you wrote and added to
# the classpath):
#   checkers:
#     MyProjectSqlSink:
#       enabled: true
#       severity: CRITICAL
#       class: com.example.MyCustomSqlSinkChecker
#       cwe: CWE-89
#       context_depth: 2
#       sink_family: sql.sinks
#       taint_domain: MIXED
#       languages: [all]

checkers:
  DivideByZero:
    enabled: true
    languages: [all]
    severity: HIGH
    cwe: CWE-369
    context_depth: 2
    path_sensitivity: full
    description: "CWE-369: division or modulo by zero"
    class: org.plumb.dfa.checkers.taint.DivByZeroChecker
  IntegerOverflow:
    enabled: true
    languages: [all]
    severity: MEDIUM
    cwe: CWE-190
    context_depth: 2
    path_sensitivity: full
    description: "CWE-190: integer overflow / wrap"
    class: org.plumb.dfa.checkers.taint.IntOverflowChecker
  NullDereference:
    enabled: true
    languages: [all]
    severity: HIGH
    cwe: CWE-476
    context_depth: 1
    path_sensitivity: full
    description: "CWE-476: null pointer dereference"
    class: org.plumb.dfa.checkers.taint.NullDerefChecker
  ResourceLeak:
    enabled: true
    languages: [all]
    severity: MEDIUM
    cwe: CWE-404
    context_depth: 2
    path_sensitivity: full
    description: "CWE-404/459: resource opened but not closed"
    class: org.plumb.dfa.checkers.taint.ResourceLeakChecker
  SensitiveDataLeak:
    enabled: true
    languages: [java, kotlin, scala]
    severity: CRITICAL
    cwe: CWE-532
    context_depth: 3
    path_sensitivity: full
    taint_domain: MIXED
    description: "CWE-532: sensitive data flows to sink"
    class: org.plumb.dfa.checkers.taint.SensitiveDataLeakChecker
  UncheckedReturn:
    enabled: true
    languages: [java, kotlin, scala]
    severity: MEDIUM
    cwe: CWE-252
    context_depth: 1
    description: "CWE-252: unchecked return value"
    # class: org.plumb.dfa.checkers.UncheckedReturnChecker
    class: org.plumb.style.security.UncheckedReturnCheck
  ConstantCondition:
    enabled: true
    languages: [all]
    severity: LOW
    cwe: CWE-570
    description: "CWE-570/571: branch condition is a compile-time constant"
    class: org.plumb.dfa.checkers.taint.LiteralBooleanConditionChecker
  # The AST version covers the same coverage as the DFA half via
  # constructor body FieldDeclaration + AssignExpr walk.
  # DFA-based ORM_LOAD_NULL_CHECK. Catches load
  # + null-check that AST misses when the null check
  # happens after aliasing or several statements later.
  OrmLoadNullCheckDfa:
    enabled: true
    languages: [java, kotlin, scala]
    severity: LOW
    cwe: CWE-252
    context_depth: 1
    path_sensitivity: full
    description: "CWE-252: load result compared to null after aliasing (DFA)"
    class: org.plumb.dfa.checkers.controlflow.OrmLoadNullCheckDfaChecker
    aggressiveness: medium
  # DFA-based ORM_UNNECESSARY_GET. Catches the
  # cross-method "find result never used in content
  # access" case that the AST version can't track.
  OrmUnnecessaryGetDfa:
    enabled: true
    languages: [java, kotlin, scala]
    severity: LOW
    cwe: CWE-252
    context_depth: 1
    description: "CWE-252: Session.get/find result not used in content access (DFA)"
    class: org.plumb.dfa.checkers.controlflow.OrmUnnecessaryGetDfaChecker
    aggressiveness: medium
  # DFA-based ORM_LOST_UPDATE. Catches the
  # cross-method "entity persisted via helper chain"
  # case that the AST version can't see (it only
  # checks the immediate function body for direct
  # persist/save/merge calls).
  OrmLostUpdateDfa:
    enabled: true
    languages: [java, kotlin, scala]
    severity: MEDIUM
    cwe: CWE-459
    context_depth: 1
    description: "CWE-459: transient entity mutated but not persisted, even via helper (DFA)"
    class: org.plumb.dfa.checkers.controlflow.OrmLostUpdateDfaChecker
    aggressiveness: medium
  # DFA-based SINGLETON_RACE. Catches the
  # cross-method field-access race that the AST
  # version can't see (it only inspects one method
  # at a time).
  SingletonRaceDfa:
    # disabled by default 鈥?plumb-style
    # SingletonRaceCheck (org.plumb.style.concurrency) covers
    # the same CWE-366 with better precision. Set to true
    # to enable the DFA implementation (which inspects more
    # methods but is noisier on real codebases).
    enabled: false
    languages: [java, kotlin, scala]
    severity: HIGH
    cwe: CWE-366
    context_depth: 1
    description: "CWE-366: field read+write across multiple methods in a singleton (DFA)"
    class: org.plumb.dfa.checkers.controlflow.SingletonRaceDfaChecker
    aggressiveness: medium
  # DFA-based SERVLET_ATOMICITY. Catches
  # getAttribute/setAttribute on the same key across
  # different methods.
  ServletAtomicityDfa:
    # disabled by default 鈥?plumb-style
    # ServletAtomicityCheck (org.plumb.style.concurrency) covers
    # the same CWE-362 with better precision. Set to true
    # to enable the DFA implementation.
    enabled: false
    languages: [java, kotlin, scala]
    severity: HIGH
    cwe: CWE-362
    context_depth: 1
    description: "CWE-362: getAttribute/setAttribute on the same key across methods (DFA)"
    class: org.plumb.dfa.checkers.controlflow.ServletAtomicityDfaChecker
    aggressiveness: medium
  # Boundary constraint checkers. Each is a
  # concrete subclass of BoundaryConstraintChecker
  # (Range lattice + GuardStore + Z3 implication)
  # so the rules fire separately for CWE-190 / -191
  # / -369 / -129. Always enabled (cheap 鈥?only
  # fires on arithmetic / array ops); per-CWE YAML
  # whitelist decides which actually reports.
  BoundaryOverflow:
    enabled: true
    languages: [all]
    severity: HIGH
    cwe: CWE-190
    description: "CWE-190 integer overflow via range + Z3 constraint"
    class: org.plumb.dfa.checkers.boundary.OverflowConstraintChecker
  BoundaryUnderflow:
    enabled: true
    languages: [all]
    severity: HIGH
    cwe: CWE-191
    description: "CWE-191 integer underflow via range + Z3 constraint"
    class: org.plumb.dfa.checkers.boundary.UnderflowConstraintChecker
  BoundaryDivZero:
    enabled: true
    languages: [all]
    severity: HIGH
    cwe: CWE-369
    description: "CWE-369 div/mod-by-zero via range + Z3 constraint"
    class: org.plumb.dfa.checkers.boundary.DivZeroConstraintChecker
  BoundaryArrayBounds:
    enabled: true
    languages: [all]
    severity: HIGH
    cwe: CWE-129
    description: "CWE-129 array out-of-bounds via range + Z3 constraint"
    class: org.plumb.dfa.checkers.boundary.ArrayBoundsConstraintChecker
  # CWE-1333: a regular expression compiled from tainted data.
  #
  # The rule watches ONE sink family -- `regex.sinks`. Its shared
  # patterns are the Java-library symbols (java.util.regex.Pattern,
  # reachable from every JVM language); its per-language table holds
  # kotlin.text.Regex and scala.util.matching.Regex. One defect
  # class, one CWE, and no language sees another's sink.
  RegexInjection:
    enabled: true
    languages: [all]
    severity: MEDIUM
    cwe: CWE-1333
    description: "CWE-1333: regular expression compiled from tainted data (ReDoS / bypass)"
    class: org.plumb.dfa.checkers.taint.RegexInjectionChecker
  # The defect classes the rule-pack conversion added. Each family is filled
  # from a converted rule pack, and each needs its own rule -- a family with
  # no rule is a family that can never fire.
  ServerSideTemplateInjection:
    enabled: true
    languages: [java, kotlin, scala]
    severity: CRITICAL
    cwe: CWE-1336
    description: "CWE-1336: tainted data compiled as a server-side template"
    class: org.plumb.dfa.checkers.taint.ServerSideTemplateInjectionChecker
  HttpParameterPollution:
    enabled: true
    languages: [all]
    severity: MEDIUM
    cwe: CWE-235
    description: "CWE-235: tainted data in an outbound HTTP request's URI or parameters"
    class: org.plumb.dfa.checkers.taint.HttpParameterPollutionChecker
  DangerousFileInclusion:
    enabled: true
    languages: [all]
    severity: CRITICAL
    cwe: CWE-98
    description: "CWE-98: tainted data choosing which file is included"
    class: org.plumb.dfa.checkers.taint.DangerousFileInclusionChecker
  NoSqlInjection:
    enabled: true
    languages: [all]
    severity: HIGH
    cwe: CWE-943
    description: "CWE-943: tainted data in a NoSQL query filter or document"
    class: org.plumb.dfa.checkers.taint.NoSqlInjectionChecker
  JsonInjection:
    enabled: true
    languages: [all]
    severity: MEDIUM
    cwe: CWE-91
    description: "CWE-91: tainted data in a JSON serializer's structural position"
    class: org.plumb.dfa.checkers.taint.JsonInjectionChecker
  XQueryInjection:
    enabled: true
    languages: [all]
    severity: HIGH
    cwe: CWE-943
    description: "CWE-943: tainted data in an XQuery expression"
    class: org.plumb.dfa.checkers.taint.XQueryInjectionChecker
  XsltInjection:
    enabled: true
    languages: [all]
    severity: HIGH
    cwe: CWE-643
    description: "CWE-643: tainted data in an XSLT stylesheet or transform"
    class: org.plumb.dfa.checkers.taint.XsltInjectionChecker
  XmlInjection:
    enabled: true
    languages: [all]
    severity: HIGH
    cwe: CWE-91
    description: "CWE-91: tainted data in an XML serializer's element name or attribute"
    class: org.plumb.dfa.checkers.taint.XmlInjectionChecker
  # CWE-732: a file permission granted to everyone.
  #
  # Not a taint rule -- the dangerous call is the call itself.
  # The checker reads the `ownerOnly` flag out of the argument
  # list, so `setReadable(true, true)` is not a finding while
  # `setReadable(true)` is.
  FilePermission:
    enabled: true
    languages: [java, kotlin, scala]
    severity: MEDIUM
    cwe: CWE-732
    description: "CWE-732: file permissions granted to everyone instead of the owner"
    class: org.plumb.dfa.checkers.taint.FilePermissionChecker

  # The families that carried a pattern set with NO watcher.
  #
  # A sink family is a pattern set; a checker is what looks at it. A family
  # with patterns and no checker matches a call and the match leads nowhere:
  # the defect class could not produce a finding at all. These twelve were in
  # that state -- measured by asking which families are named by no checker and
  # no rule, then confirming the answer by searching the whole tree for each
  # family key.
  CodeInjection:
    enabled: true
    languages: [all]
    severity: CRITICAL
    cwe: CWE-94,CWE-95,CWE-494
    description: "CWE-94/95/494: tainted data evaluated as code"
    class: org.plumb.dfa.checkers.taint.CodeInjectionChecker
  CookieInjection:
    enabled: true
    languages: [all]
    severity: MEDIUM
    cwe: CWE-113
    description: "CWE-113: tainted data written into a response cookie"
    class: org.plumb.dfa.checkers.taint.CookieInjectionChecker
  CredentialExposure:
    enabled: true
    languages: [all]
    severity: HIGH
    cwe: CWE-256,CWE-798
    description: "CWE-256/798: credential stored or transmitted in the clear"
    class: org.plumb.dfa.checkers.taint.CredentialExposureChecker
  DenialOfService:
    enabled: true
    languages: [all]
    severity: MEDIUM
    cwe: CWE-730,CWE-776
    description: "CWE-730/776: tainted data controls a resource quantity"
    class: org.plumb.dfa.checkers.taint.DenialOfServiceChecker
  FormulaInjection:
    enabled: true
    languages: [all]
    severity: MEDIUM
    cwe: CWE-1236
    description: "CWE-1236: tainted data written into a spreadsheet cell"
    class: org.plumb.dfa.checkers.taint.FormulaInjectionChecker
  HeaderInjection:
    enabled: true
    languages: [all]
    severity: MEDIUM
    cwe: CWE-93,CWE-113
    description: "CWE-93/113: CRLF injection into an HTTP header"
    class: org.plumb.dfa.checkers.taint.HeaderInjectionChecker
  InsecureCommunication:
    enabled: true
    languages: [all]
    severity: HIGH
    cwe: CWE-297,CWE-319,CWE-326,CWE-327
    description: "CWE-297/319/326/327: sensitive data sent over an unprotected channel"
    class: org.plumb.dfa.checkers.taint.InsecureCommunicationChecker
  InsecureRandomFamily:
    enabled: true
    languages: [all]
    severity: MEDIUM
    cwe: CWE-335,CWE-330
    description: "CWE-335/330: predictable value used where unpredictability matters"
    class: org.plumb.dfa.checkers.taint.InsecureRandomFamilyChecker
  LogInjectionFamily:
    enabled: true
    languages: [all]
    severity: MEDIUM
    cwe: CWE-117
    description: "CWE-117: tainted data written into a log record"
    class: org.plumb.dfa.checkers.taint.LogInjectionFamilyChecker
  PrivacyViolation:
    enabled: true
    languages: [all]
    severity: MEDIUM
    cwe: CWE-215,CWE-359,CWE-489,CWE-497
    description: "CWE-215/359/489/497: personal data leaves the boundary it belongs inside"
    class: org.plumb.dfa.checkers.taint.PrivacyViolationChecker
  ResourceInjection:
    enabled: true
    languages: [all]
    severity: MEDIUM
    cwe: CWE-94,CWE-95,CWE-99,CWE-502
    description: "CWE-94/95/99/502: tainted data selects the resource that is used"
    class: org.plumb.dfa.checkers.taint.ResourceInjectionChecker
  SettingManipulation:
    enabled: true
    languages: [all]
    severity: MEDIUM
    cwe: CWE-15
    description: "CWE-15: tainted data controls a system or configuration setting"
    class: org.plumb.dfa.checkers.taint.SettingManipulationChecker