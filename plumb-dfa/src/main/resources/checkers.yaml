# checkers.yaml
#
# Per-checker configuration. A checker is enabled by
# default; set `enabled: false` to disable.
#
# Adding a custom checker (one you wrote and added to
# the classpath):
#   checkers:
#     MyProjectSqlSink:
#       enabled: true
#       severity: CRITICAL
#       class: com.example.MyCustomSqlSinkChecker
#       cwe: CWE-89
#       context_depth: 2
#       sink_family: sql.sinks
#       taint_domain: MIXED

checkers:
  DivideByZero:
    enabled: true
    severity: HIGH
    cwe: CWE-369
    context_depth: 2
    path_sensitivity: full
    description: "CWE-369: division or modulo by zero"
    class: org.plumb.dfa.checkers.taint.DivByZeroChecker
  IntegerOverflow:
    enabled: true
    severity: MEDIUM
    cwe: CWE-190
    context_depth: 2
    path_sensitivity: full
    description: "CWE-190: integer overflow / wrap"
    class: org.plumb.dfa.checkers.taint.IntOverflowChecker
  NullDereference:
    enabled: true
    severity: HIGH
    cwe: CWE-476
    context_depth: 1
    path_sensitivity: full
    description: "CWE-476: null pointer dereference"
    class: org.plumb.dfa.checkers.taint.NullDerefChecker
  ResourceLeak:
    enabled: true
    severity: MEDIUM
    cwe: CWE-404
    context_depth: 2
    path_sensitivity: full
    description: "CWE-404/459: resource opened but not closed"
    class: org.plumb.dfa.checkers.taint.ResourceLeakChecker
  SensitiveDataLeak:
    enabled: true
    severity: CRITICAL
    cwe: CWE-532
    context_depth: 3
    path_sensitivity: full
    taint_domain: MIXED
    description: "CWE-532: sensitive data flows to sink"
    class: org.plumb.dfa.checkers.taint.SensitiveDataLeakChecker
  UncheckedReturn:
    enabled: true
    severity: MEDIUM
    cwe: CWE-252
    context_depth: 1
    description: "CWE-252: unchecked return value"
    # class: org.plumb.dfa.checkers.UncheckedReturnChecker
    class: org.plumb.style.security.UncheckedReturnCheck
  ConstantCondition:
    enabled: true
    severity: LOW
    cwe: CWE-570
    description: "CWE-570/571: branch condition is a compile-time constant"
    class: org.plumb.dfa.checkers.taint.LiteralBooleanConditionChecker
  # The AST version covers the same coverage as the DFA half via
  # constructor body FieldDeclaration + AssignExpr walk.
  # DFA-based ORM_LOAD_NULL_CHECK. Catches load
  # + null-check that AST misses when the null check
  # happens after aliasing or several statements later.
  OrmLoadNullCheckDfa:
    enabled: true
    severity: LOW
    cwe: CWE-252
    context_depth: 1
    path_sensitivity: full
    description: "CWE-252: load result compared to null after aliasing (DFA)"
    class: org.plumb.dfa.checkers.controlflow.OrmLoadNullCheckDfaChecker
    aggressiveness: medium
  # DFA-based ORM_UNNECESSARY_GET. Catches the
  # cross-method "find result never used in content
  # access" case that the AST version can't track.
  OrmUnnecessaryGetDfa:
    enabled: true
    severity: LOW
    cwe: CWE-252
    context_depth: 1
    description: "CWE-252: Session.get/find result not used in content access (DFA)"
    class: org.plumb.dfa.checkers.controlflow.OrmUnnecessaryGetDfaChecker
    aggressiveness: medium
  # DFA-based ORM_LOST_UPDATE. Catches the
  # cross-method "entity persisted via helper chain"
  # case that the AST version can't see (it only
  # checks the immediate function body for direct
  # persist/save/merge calls).
  OrmLostUpdateDfa:
    enabled: true
    severity: MEDIUM
    cwe: CWE-459
    context_depth: 1
    description: "CWE-459: transient entity mutated but not persisted, even via helper (DFA)"
    class: org.plumb.dfa.checkers.controlflow.OrmLostUpdateDfaChecker
    aggressiveness: medium
  # DFA-based SINGLETON_RACE. Catches the
  # cross-method field-access race that the AST
  # version can't see (it only inspects one method
  # at a time).
  SingletonRaceDfa:
    # disabled by default — plumb-style
    # SingletonRaceCheck (org.plumb.style.concurrency) covers
    # the same CWE-366 with better precision. Set to true
    # to enable the DFA implementation (which inspects more
    # methods but is noisier on real codebases).
    enabled: false
    severity: HIGH
    cwe: CWE-366
    context_depth: 1
    description: "CWE-366: field read+write across multiple methods in a singleton (DFA)"
    class: org.plumb.dfa.checkers.controlflow.SingletonRaceDfaChecker
    aggressiveness: medium
  # DFA-based SERVLET_ATOMICITY. Catches
  # getAttribute/setAttribute on the same key across
  # different methods.
  ServletAtomicityDfa:
    # disabled by default — plumb-style
    # ServletAtomicityCheck (org.plumb.style.concurrency) covers
    # the same CWE-362 with better precision. Set to true
    # to enable the DFA implementation.
    enabled: false
    severity: HIGH
    cwe: CWE-362
    context_depth: 1
    description: "CWE-362: getAttribute/setAttribute on the same key across methods (DFA)"
    class: org.plumb.dfa.checkers.controlflow.ServletAtomicityDfaChecker
    aggressiveness: medium
  # Boundary constraint checkers. Each is a
  # concrete subclass of BoundaryConstraintChecker
  # (Range lattice + GuardStore + Z3 implication)
  # so the rules fire separately for CWE-190 / -191
  # / -369 / -129. Always enabled (cheap — only
  # fires on arithmetic / array ops); per-CWE YAML
  # whitelist decides which actually reports.
  BoundaryOverflow:
    enabled: true
    severity: HIGH
    cwe: CWE-190
    description: "CWE-190 integer overflow via range + Z3 constraint"
    class: org.plumb.dfa.checkers.boundary.OverflowConstraintChecker
  BoundaryUnderflow:
    enabled: true
    severity: HIGH
    cwe: CWE-191
    description: "CWE-191 integer underflow via range + Z3 constraint"
    class: org.plumb.dfa.checkers.boundary.UnderflowConstraintChecker
  BoundaryDivZero:
    enabled: true
    severity: HIGH
    cwe: CWE-369
    description: "CWE-369 div/mod-by-zero via range + Z3 constraint"
    class: org.plumb.dfa.checkers.boundary.DivZeroConstraintChecker
  BoundaryArrayBounds:
    enabled: true
    severity: HIGH
    cwe: CWE-129
    description: "CWE-129 array out-of-bounds via range + Z3 constraint"
    class: org.plumb.dfa.checkers.boundary.ArrayBoundsConstraintChecker
  # CWE-1333: a regular expression compiled from tainted data.
  #
  # The rule watches ONE sink family -- `regex.sinks`. Its shared
  # patterns are the Java-library symbols (java.util.regex.Pattern,
  # reachable from every JVM language); its per-language table holds
  # kotlin.text.Regex and scala.util.matching.Regex. One defect
  # class, one CWE, and no language sees another's sink.
  RegexInjection:
    enabled: true
    severity: MEDIUM
    cwe: CWE-1333
    description: "CWE-1333: regular expression compiled from tainted data (ReDoS / bypass)"
    class: org.plumb.dfa.checkers.taint.RegexInjectionChecker
  # The defect classes the rule-pack conversion added. Each family is filled
  # from a converted rule pack, and each needs its own rule -- a family with
  # no rule is a family that can never fire.
  ServerSideTemplateInjection:
    enabled: true
    severity: CRITICAL
    cwe: CWE-1336
    description: "CWE-1336: tainted data compiled as a server-side template"
    class: org.plumb.dfa.checkers.taint.ServerSideTemplateInjectionChecker
  HttpParameterPollution:
    enabled: true
    severity: MEDIUM
    cwe: CWE-235
    description: "CWE-235: tainted data in an outbound HTTP request's URI or parameters"
    class: org.plumb.dfa.checkers.taint.HttpParameterPollutionChecker
  DangerousFileInclusion:
    enabled: true
    severity: CRITICAL
    cwe: CWE-98
    description: "CWE-98: tainted data choosing which file is included"
    class: org.plumb.dfa.checkers.taint.DangerousFileInclusionChecker
  NoSqlInjection:
    enabled: true
    severity: HIGH
    cwe: CWE-943
    description: "CWE-943: tainted data in a NoSQL query filter or document"
    class: org.plumb.dfa.checkers.taint.NoSqlInjectionChecker
  JsonInjection:
    enabled: true
    severity: MEDIUM
    cwe: CWE-91
    description: "CWE-91: tainted data in a JSON serializer's structural position"
    class: org.plumb.dfa.checkers.taint.JsonInjectionChecker
  XQueryInjection:
    enabled: true
    severity: HIGH
    cwe: CWE-943
    description: "CWE-943: tainted data in an XQuery expression"
    class: org.plumb.dfa.checkers.taint.XQueryInjectionChecker
  XsltInjection:
    enabled: true
    severity: HIGH
    cwe: CWE-643
    description: "CWE-643: tainted data in an XSLT stylesheet or transform"
    class: org.plumb.dfa.checkers.taint.XsltInjectionChecker
  XmlInjection:
    enabled: true
    severity: HIGH
    cwe: CWE-91
    description: "CWE-91: tainted data in an XML serializer's element name or attribute"
    class: org.plumb.dfa.checkers.taint.XmlInjectionChecker
  # CWE-732: a file permission granted to everyone.
  #
  # Not a taint rule -- the dangerous call is the call itself.
  # The checker reads the `ownerOnly` flag out of the argument
  # list, so `setReadable(true, true)` is not a finding while
  # `setReadable(true)` is.
  FilePermission:
    enabled: true
    severity: MEDIUM
    cwe: CWE-732
    description: "CWE-732: file permissions granted to everyone instead of the owner"
    class: org.plumb.dfa.checkers.taint.FilePermissionChecker