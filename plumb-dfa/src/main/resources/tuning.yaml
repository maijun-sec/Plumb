# tuning.yaml
#
# Engine-wide tuning knobs. Defaults are tuned for
# mid-size projects (10K-100K LoC). worklist_max_size
# bounds the facts ONE function may record, so raise it
# only for a function that records more than the
# default; z3_timeout_ms bounds ONE solver query.
# For smaller projects, you can lower context_depth to
# 1 for faster analysis.
#
# All values can be overridden at runtime via CLI
# flags (-X engine.context_depth=1 etc.) or by
# passing a custom YAML to ConfigLoader.

engine:
  context_depth: 2                    # how deep the engine follows a callee (0/1/2/3)
  worklist_max_size: 10000            # max facts one function may track
  z3_timeout_ms: 5000                 # per-query Z3 timeout
  summary_cache_size: 1000            # per-program summary cache; a refused summary is
                                      # reported as an incomplete analysis, not silently dropped
  reverse_walk_max_depth: 8           # ACCEPTED FOR COMPATIBILITY, NOT USED: the reverse
                                      # taint walk it names does not exist. Kept so an
                                      # existing configuration file still loads.
  pre_scan_enabled: true              # run CrossFunctionConstantPropagation pre-scan
  library_call_classification: true   # treat jdk methods as opaque
  taint_caller_string_concat: true    # include StringBuilder.append in taint propagation

# Path sensitivity:
#   full     — the source-to-sink path is checked for unreachability
#   windowed — same as full today; the windowed scan is not implemented
#   none     — the check is switched off and every finding fires
path_sensitivity: full

# Reporting:
reporting:
  include_fp_candidates: false        # if true, also report suppressed-as-fp findings
  group_by: cwe_family                # how to group findings in summary
  output_format: sarif                 # sarif | ndjson | console

# Performance:
performance:
  parallel: false                      # multi-threaded analysis (WIP)
  per_function_timeout_ms: 30000       # per-function analysis timeout
