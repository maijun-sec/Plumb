# argument-passthrough configuration
#
# A library method can carry taint into its RESULT in two ways, and they
# are not the same way:
#
#   - the RECEIVER's taint reaches the result -- that shape is in
#     receiver-passthrough.yaml;
#   - an ARGUMENT's taint reaches the result -- `path.resolve(userInput)`
#     returns a path built from the argument, and `String.valueOf(x)`
#     returns x's text. THIS file is that shape.
#
# The rules here apply to callees the engine has NO summary for. Without
# them the result of such a call is clean and the taint stops at the call,
# which is how a finding goes missing. With them applied unconditionally,
# every method would pass its argument's taint on and the results would be
# tainted where they are not -- so the table says WHICH method, and WHICH
# argument, and each entry is reviewable on its own.
#
# Pattern form: a Java regex matched against the callee signature (e.g.
# "java.nio.file.Path.resolve/1"). Both `.` (TAC dot form) and `#` (legacy
# JVM form) separators are accepted by the loader.
#
# The method name is followed by a WORD BOUNDARY, so a rule for
# `Path.resolve` does not also match `Path.resolveSibling`. The loader
# matches with find(), not matches(), so without the boundary a rule
# would match every longer name that starts with it.
#
# Entry form:
#
#   - pattern: '<regex>'
#     arg_index: <n>        the USER argument whose taint reaches the
#                            result. The receiver is not a user argument,
#                            so the index is zero-based over the arguments
#                            the source wrote.
#     arg_index: [n, m]     several positions: the result is tainted when
#                            any of them is.
#     arg_index: any        the rule does not name one position: any user
#                            argument carries its taint to the result.
#
# Use
#   enabled: false
# to turn a family off without removing the entry.

families:
  # ===== The JDK and Servlet methods whose RESULT is built from an ARGUMENT =====
  #
  # `Path.resolve(String)` returns a path built from the argument, so a
  # tainted segment reaches the result -- and the result is what a file
  # operation then uses.
  jdk-argument-passthrough:
    enabled: true
    patterns:
      - pattern: '^((?:[\w.]+\.)*)Path\.resolve\b(/\d+)?'
        arg_index: 0
      - pattern: '^((?:[\w.]+\.)*)Paths\.get\b(/\d+)?'
        arg_index: 0
      - pattern: '^((?:[\w.]+\.)*)String\.valueOf\b(/\d+)?'
        arg_index: 0
      - pattern: '^((?:[\w.]+\.)*)String\.format\b(/\d+)?'
        arg_index: any
      - pattern: '^((?:[\w.]+\.)*)String\.join\b(/\d+)?'
        arg_index: any
      - pattern: '^((?:[\w.]+\.)*)File\.newInstance\b(/\d+)?'
        arg_index: 0

