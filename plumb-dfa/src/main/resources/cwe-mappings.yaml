# cwe-mappings.yaml
#
# Maps a finding key (e.g. "SensitiveDataLeak_sql") to
# its CWE family. The key format is
# "{CheckerName}" or "{CheckerName}_{SinkFamilyShortName}".
#
# A checker can emit multiple CWE families from a
# single analysis pass. For example,
# SensitiveDataLeak emits different CWEs for SQL,
# LDAP, command, file-path, and format-string sinks.
#
# Adding a new mapping:
#   mappings:
#     MyChecker: CWE-XXX
#     MyChecker_sub: CWE-YYY
#
# Used by the SARIF / NDJSON reporter to attach a CWE
# label to each finding.

mappings:
  DivideByZero: CWE-369
  IntegerOverflow: CWE-190
  NullDereference: CWE-476
  ResourceLeak: CWE-404
  ResourceLeak_CloseOnPath: CWE-459
  SensitiveDataLeak_sql: CWE-89
  SensitiveDataLeak_ldap: CWE-90
  SensitiveDataLeak_command: CWE-78
  SensitiveDataLeak_file: CWE-22
  SensitiveDataLeak_url: CWE-918
  SensitiveDataLeak_reflection: CWE-470
  SensitiveDataLeak_format: CWE-134
  SensitiveDataLeak_log: CWE-117
  SensitiveDataLeak_deserialize: CWE-502
  SensitiveDataLeak_xpath: CWE-643
  SensitiveDataLeak_regex: CWE-1333
  SensitiveDataLeak_header: CWE-93
  SensitiveDataLeak_nosql: CWE-943
  SensitiveDataLeak_ognl: CWE-94
  # The defect classes the rule-pack conversion added. Each has its own
  # checker, and each checker has its own CWE -- the mapping is what the
  # coverage report reads, so a checker without an entry here is a rule
  # whose CWE is not accounted for.
  ServerSideTemplateInjection: CWE-1336
  HttpParameterPollution: CWE-235
  DangerousFileInclusion: CWE-98
  NoSqlInjection: CWE-943
  JsonInjection: CWE-91
  XQueryInjection: CWE-943
  XsltInjection: CWE-643
  XmlInjection: CWE-91
  SensitiveDataLeak_openRedirect: CWE-601
  SensitiveDataLeak_xml: CWE-91
  UncheckedReturn: CWE-252
  InfiniteLoop: CWE-835
  ConstantCondition: CWE-570
  BadShift: CWE-758
  RegexInjection: CWE-1333
  FilePermission: CWE-732
  # CWE-566: tainted data reaches a DATABASE, including as a BOUND PARAMETER.
  # It is NOT CWE-89 -- see the DatabaseAccessChecker's javadoc for why the
  # two are separate defect classes.
  DatabaseAccess: CWE-566
  # The families that carried a pattern set with NO watcher. The mapping is
  # what the coverage report reads, so a checker without an entry here is a
  # rule whose CWE is not accounted for.
  CodeInjection: CWE-94
  CookieInjection: CWE-113
  CredentialExposure: CWE-256
  DenialOfService: CWE-776
  FormulaInjection: CWE-1236
  HeaderInjection: CWE-93
  InsecureCommunication: CWE-319
  InsecureRandomFamily: CWE-330
  LogInjectionFamily: CWE-117
  PrivacyViolation: CWE-359
  ResourceInjection: CWE-99
  SettingManipulation: CWE-15