# receiver-passthrough configuration
#
# When the receiver-taint passthrough
# fallback fires in
# TaintedCheckerBase.propagateTaintFromCalleeSummary
# (Lesson 801), it would otherwise apply to
# ANY calleeSig whose receiver is tainted —
# including POJO getters, util-class
# factories, optional wrappers, etc. Most
# of these return non-tainted data, so the
# fallback would produce FP.
#
# This config lists ONLY the JDK / Servlet
# / IO methods whose callee has no plumb
# summary BUT is *known* to return tainted
# data when the receiver is tainted. The
# passthrough is gated on a regex match
# against the callee signature.
#
# Pattern form: Java regex matched against
# the calleeSig (e.g.
# "javax.servlet.http.HttpServletRequest.getCookies/1").
# Both `.` (TAC dot form) and `#` (legacy
# JVM form) separators are accepted by the
# loader. Use
#   enabled: false
# to turn a family off without removing
# the entry (useful for project-specific
# toggles).

families:
  # ===== Servlet request getters =====
  # The receiver (HttpServletRequest) is
  # tainted via InputSourcePatterns when
  # it carries user-controlled data (path
  # info, query string, cookies, headers).
  # The getter returns data derived from
  # that tainted request, so the dest is
  # tainted. Covers Juliet CWE89
  # __getCookies_Servlet,
  # __getParameter_Servlet,
  # __getQueryString_Servlet,
  # __getHeader_Servlet, etc.
  #
  # Note: plumb-tac may emit calleeSig in
  # either FQN form
  # ("javax.servlet.http.HttpServletRequest.getCookies/1")
  # or short form ("HttpServletRequest.getCookies/1")
  # depending on whether the symbol
  # resolver could locate the FQN. Each
  # pattern uses
  # `^((?:[\w.]+\.)*)Class\.method` to
  # match both forms (the prefix may be
  # zero or more dotted words).
  servlet-request-getters:
    enabled: true
    patterns:
      - '^((?:[\w.]+\.)*)HttpServletRequest\.getCookies(/\d+)?'
      - '^((?:[\w.]+\.)*)HttpServletRequest\.getParameter(/\d+)?'
      - '^((?:[\w.]+\.)*)HttpServletRequest\.getParameterValues(/\d+)?'
      - '^((?:[\w.]+\.)*)HttpServletRequest\.getParameterMap(/\d+)?'
      - '^((?:[\w.]+\.)*)HttpServletRequest\.getQueryString(/\d+)?'
      - '^((?:[\w.]+\.)*)HttpServletRequest\.getHeader(/\d+)?'
      - '^((?:[\w.]+\.)*)HttpServletRequest\.getHeaders(/\d+)?'
      - '^((?:[\w.]+\.)*)HttpServletRequest\.getHeaderNames(/\d+)?'
      - '^((?:[\w.]+\.)*)HttpServletRequest\.getInputStream(/\d+)?'
      - '^((?:[\w.]+\.)*)HttpServletRequest\.getReader(/\d+)?'
      - '^((?:[\w.]+\.)*)HttpServletRequest\.getPathInfo(/\d+)?'
      - '^((?:[\w.]+\.)*)HttpServletRequest\.getPathTranslated(/\d+)?'
      - '^((?:[\w.]+\.)*)HttpServletRequest\.getRequestURI(/\d+)?'
      - '^((?:[\w.]+\.)*)HttpServletRequest\.getRequestURL(/\d+)?'
      - '^((?:[\w.]+\.)*)HttpServletRequest\.getMethod(/\d+)?'
      - '^((?:[\w.]+\.)*)HttpServletRequest\.getRemoteAddr(/\d+)?'
      - '^((?:[\w.]+\.)*)HttpServletRequest\.getRemoteHost(/\d+)?'
      - '^((?:[\w.]+\.)*)HttpServletRequest\.getRemoteUser(/\d+)?'
      - '^((?:[\w.]+\.)*)HttpServletRequest\.getServerName(/\d+)?'
      - '^((?:[\w.]+\.)*)HttpServletRequest\.getRequestedSessionId(/\d+)?'
      - '^((?:[\w.]+\.)*)HttpServletRequest\.getPart(/\d+)?'
      - '^((?:[\w.]+\.)*)HttpServletRequest\.getParts(/\d+)?'
      - '^((?:[\w.]+\.)*)HttpServletRequest\.getPathVariable(/\d+)?'
      - '^((?:[\w.]+\.)*)HttpServletRequest\.getRequestParam(/\d+)?'
      - '^((?:[\w.]+\.)*)HttpServletRequest\.getPartNames(/\d+)?'

  # ===== Cookie getters =====
  # Cookie is the dest of a tainted
  # source via HttpServletRequest.getCookies
  # so Cookie.getValue/getName etc. return
  # tainted data.
  cookie-getters:
    enabled: true
    patterns:
      - '^((?:[\w.]+\.)*)Cookie\.getValue(/\d+)?'
      - '^((?:[\w.]+\.)*)Cookie\.getName(/\d+)?'
      - '^((?:[\w.]+\.)*)Cookie\.getDomain(/\d+)?'
      - '^((?:[\w.]+\.)*)Cookie\.getPath(/\d+)?'
      - '^((?:[\w.]+\.)*)Cookie\.getComment(/\d+)?'
      - '^((?:[\w.]+\.)*)Cookie\.getVersion(/\d+)?'
# Juliet IR quirk: the Juliet
      # testcases use Cookie as a real
      # JDK class but plumb-tac's symbol
      # resolver does not always find
      # `javax.servlet.http.Cookie` and
      # emits `scope.getValue/0` with the
      # synthetic name `scope` standing
      # in for the Cookie type. Match
      # the synthetic name so Juliet
      # CWE89 getCookies_Servlet tests
      # still hit the passthrough.
      - '^scope\.getValue(/\d+)?'
      - '^scope\.getName(/\d+)?'
      - '^scope\.getDomain(/\d+)?'
      - '^scope\.getPath(/\d+)?'
      - '^scope\.getComment(/\d+)?'
      - '^scope\.getVersion(/\d+)?'

  # ===== HttpSession getters =====
  # HttpSession is tainted via request
  # getSession(). Its getters return
  # tainted values.
  httpsession-getters:
    enabled: true
    patterns:
      - '^((?:[\w.]+\.)*)HttpSession\.getAttribute(/\d+)?'
      - '^((?:[\w.]+\.)*)HttpSession\.getId(/\d+)?'
      - '^((?:[\w.]+\.)*)HttpSession\.getLastAccessedTime(/\d+)?'
      - '^((?:[\w.]+\.)*)HttpSession\.getCreationTime(/\d+)?'

  # ===== URL connection getters =====
  # URLConnection.getInputStream returns
  # a stream derived from the (tainted)
  # URL. The stream is tainted.
  url-connection-getters:
    enabled: true
    patterns:
      - '^((?:[\w.]+\.)*)URLConnection\.getInputStream(/\d+)?'
      - '^((?:[\w.]+\.)*)HttpURLConnection\.getInputStream(/\d+)?'
      - '^((?:[\w.]+\.)*)URLConnection\.getContent(/\d+)?'
      - '^((?:[\w.]+\.)*)URL\.openStream(/\d+)?'
      - '^((?:[\w.]+\.)*)URL\.openConnection(/\d+)?'
      - '^((?:[\w.]+\.)*)URLConnection\.getHeaderField(/\d+)?'
      - '^((?:[\w.]+\.)*)URLConnection\.getHeaderFields(/\d+)?'

  # ===== IO stream getters =====
  # Stream.read returns tainted byte
  # values from a tainted stream.
  # BufferedReader.readLine returns
  # tainted lines from a tainted reader.
  io-stream-getters:
    enabled: true
    patterns:
      - '^((?:[\w.]+\.)*)InputStream\.read(/\d+)?'
      - '^((?:[\w.]+\.)*)Reader\.read(/\d+)?'
      - '^((?:[\w.]+\.)*)BufferedReader\.readLine(/\d+)?'
      - '^((?:[\w.]+\.)*)BufferedReader\.read(/\d+)?'
      - '^((?:[\w.]+\.)*)Scanner\.nextLine(/\d+)?'
      - '^((?:[\w.]+\.)*)Scanner\.next(/\d+)?'
      - '^((?:[\w.]+\.)*)Scanner\.nextInt(/\d+)?'
      - '^((?:[\w.]+\.)*)Scanner\.nextLong(/\d+)?'
      - '^((?:[\w.]+\.)*)Scanner\.nextShort(/\d+)?'
      - '^((?:[\w.]+\.)*)Scanner\.nextByte(/\d+)?'

  # ===== Socket getters =====
  # Socket.getInputStream returns tainted
  # bytes from a tainted socket.
  socket-getters:
    enabled: true
    patterns:
      - '^((?:[\w.]+\.)*)Socket\.getInputStream(/\d+)?'
      - '^((?:[\w.]+\.)*)Socket\.getOutputStream(/\d+)?'

  # ===== Collection getters =====
  # Map.get returns a potentially tainted
  # value (the map itself is tainted).
  # Properties.getProperty returns tainted
  # String. ResultSet.getXxx returns
  # tainted column data.
  collection-getters:
    enabled: true
    patterns:
      - '^((?:[\w.]+\.)*)Map\.get(/\d+)?'
      - '^((?:[\w.]+\.)*)Hashtable\.get(/\d+)?'
      - '^((?:[\w.]+\.)*)HashMap\.get(/\d+)?'
      - '^((?:[\w.]+\.)*)LinkedHashMap\.get(/\d+)?'
      - '^((?:[\w.]+\.)*)Properties\.getProperty(/\d+)?'
      - '^((?:[\w.]+\.)*)Properties\.get(/\d+)?'

  # ===== ResultSet getters =====
  # ResultSet is tainted via the
  # ResultSet.next() input-source seed.
  # Its getters return tainted column
  # values.
  resultset-getters:
    enabled: true
    patterns:
      - '^((?:[\w.]+\.)*)ResultSet\.getString(/\d+)?'
      - '^((?:[\w.]+\.)*)ResultSet\.getNString(/\d+)?'
      - '^((?:[\w.]+\.)*)ResultSet\.getInt(/\d+)?'
      - '^((?:[\w.]+\.)*)ResultSet\.getLong(/\d+)?'
      - '^((?:[\w.]+\.)*)ResultSet\.getShort(/\d+)?'
      - '^((?:[\w.]+\.)*)ResultSet\.getByte(/\d+)?'
      - '^((?:[\w.]+\.)*)ResultSet\.getDouble(/\d+)?'
      - '^((?:[\w.]+\.)*)ResultSet\.getFloat(/\d+)?'
      - '^((?:[\w.]+\.)*)ResultSet\.getObject(/\d+)?'
      - '^((?:[\w.]+\.)*)ResultSet\.getNCharacterStream(/\d+)?'
      - '^((?:[\w.]+\.)*)ResultSet\.getCharacterStream(/\d+)?'
      - '^((?:[\w.]+\.)*)ResultSet\.getAsciiStream(/\d+)?'
      - '^((?:[\w.]+\.)*)ResultSet\.getUnicodeStream(/\d+)?'
      - '^((?:[\w.]+\.)*)ResultSet\.getBinaryStream(/\d+)?'
      - '^((?:[\w.]+\.)*)ResultSet\.getClob(/\d+)?'
      - '^((?:[\w.]+\.)*)ResultSet\.getBlob(/\d+)?'
      - '^((?:[\w.]+\.)*)ResultSet\.getArray(/\d+)?'

  # ===== String passthroughs =====
  # String methods that return derived
  # String from a tainted receiver. These
  # are already in propagateStringPassthroughs
  # but listed here so the receiver-passthrough
  # path also handles them.
  string-getters:
    enabled: true
    patterns:
      - '^((?:[\w.]+\.)*)String\.substring(/\d+)?'
      - '^((?:[\w.]+\.)*)String\.trim(/\d+)?'
      - '^((?:[\w.]+\.)*)String\.strip(/\d+)?'
      - '^((?:[\w.]+\.)*)String\.toLowerCase(/\d+)?'
      - '^((?:[\w.]+\.)*)String\.toUpperCase(/\d+)?'
      - '^((?:[\w.]+\.)*)String\.replace(/\d+)?'
      - '^((?:[\w.]+\.)*)String\.replaceAll(/\d+)?'
      - '^((?:[\w.]+\.)*)String\.replaceFirst(/\d+)?'
      - '^((?:[\w.]+\.)*)String\.split(/\d+)?'
      - '^((?:[\w.]+\.)*)String\.concat(/\d+)?'
      - '^((?:[\w.]+\.)*)String\.valueOf(/\d+)?'
      - '^((?:[\w.]+\.)*)String\.intern(/\d+)?'
  # ----- the map's own getters carry the map's taint -----
  #
  # A map whose contents are tainted returns tainted data. Which
  # method carries WHICH part of the map is the knowledge the reference
  # model records:
  #
  #   get(key)          -> the value for that key
  #   getOrDefault(...) -> the value, or the default
  #   values()          -> every VALUE
  #   keySet()          -> every KEY
  #   entrySet()        -> every KEY-VALUE PAIR
  #   forEach(...)      -> iterates the entries
  #
  # The distinction between values() and keySet() is the point: a rule
  # that asks "does the taint reach the sink" cares whether the tainted
  # thing is the key or the value, because a key and a value are used
  # in different places.
  map-getters:
    enabled: true
    patterns:
      - '^((?:[\w.]+\.)*)Map\.get(/\d+)?'
      - '^((?:[\w.]+\.)*)Map\.getOrDefault(/\d+)?'
      - '^((?:[\w.]+\.)*)Map\.values(/\d+)?'
      - '^((?:[\w.]+\.)*)Map\.keySet(/\d+)?'
      - '^((?:[\w.]+\.)*)Map\.entrySet(/\d+)?'
      - '^((?:[\w.]+\.)*)Map\.compute(/\d+)?'
      - '^((?:[\w.]+\.)*)Map\.computeIfAbsent(/\d+)?'
      - '^((?:[\w.]+\.)*)Map\.computeIfPresent(/\d+)?'
      - '^((?:[\w.]+\.)*)Map\.merge(/\d+)?'
      - '^((?:[\w.]+\.)*)Map\.putIfAbsent(/\d+)?'
      - '^((?:[\w.]+\.)*)Map\.replace(/\d+)?'
      - '^((?:[\w.]+\.)*)Map\.remove(/\d+)?'

  # ----- the collection's own getters carry the collection's taint -----
  #
  # The same shape as the map: a collection whose contents are tainted
  # returns tainted elements. The reference model records that
  # `ListIterator.next` returns the element, and that the iterator
  # itself is what carries the taint.
  collection-element-getters:
    enabled: true
    patterns:
      - '^((?:[\w.]+\.)*)ListIterator\.next(/\d+)?'
      - '^((?:[\w.]+\.)*)Iterator\.next(/\d+)?'
      - '^((?:[\w.]+\.)*)Collection\.iterator(/\d+)?'
      - '^((?:[\w.]+\.)*)List\.get(/\d+)?'
      - '^((?:[\w.]+\.)*)List\.remove(/\d+)?'
      - '^((?:[\w.]+\.)*)Set\.iterator(/\d+)?'
