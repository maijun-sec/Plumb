# Per-CWE YAML v2 for CWE369
# Whitelist (DFA rule ids Plumb actually emits): ['CatchGenericException', 'InsecureCommunication', 'UncheckedReturn', 'plumb.numeric.divide-by-zero', 'plumb.numeric.integer-overflow', 'plumb.numeric.integer-underflow', 'plumb.resource.leak']
# Generated by cwe_to_rules_v2.py
# Strategy: whitelist by what Plumb's DFA engine emits, not
# what the RuleRegistry exposes via --list-rules.

maxParallelism: 4
cgStrategy: global
aggressiveness: medium

rules:
  mode: whitelist
  enabled:
    - CatchGenericException
    - InsecureCommunication
    - UncheckedReturn
    - plumb.numeric.divide-by-zero
    - plumb.numeric.integer-overflow
    - plumb.numeric.integer-underflow
    - plumb.resource.leak

    - plumb.boundary.divide-by-zero
ai:
  enabled: false
