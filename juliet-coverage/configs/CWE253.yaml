# Per-CWE YAML v2 for CWE253
# R763 (Oct 2026): added `incorrect-return-comparison` (style check
# `pl-0763-incorrect-return-comparison`) to detect the canonical
# `if (input.read(buf) == 0)` Juliet CWE-253 pattern. Catches all
# 17 / 17 baseline testcases with zero false positives in the
# R763 unit test suite.
# Whitelist (DFA rule ids Plumb actually emits): ['CatchGenericException', 'UncheckedReturn', 'plumb.resource.leak']
# Generated by cwe_to_rules_v2.py
# Strategy: whitelist by what Plumb's DFA engine emits, not
# what the RuleRegistry exposes via --list-rules.

maxParallelism: 4
cgStrategy: global
aggressiveness: medium

rules:
  mode: whitelist
  enabled:
    - CatchGenericException
    - UncheckedReturn
    - plumb.resource.leak
    - incorrect-return-comparison

ai:
  enabled: false
