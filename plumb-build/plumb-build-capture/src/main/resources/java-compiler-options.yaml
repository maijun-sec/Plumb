# java-compiler-options.yaml
#
# The option model for the compilers the capture module understands:
# javac, ECJ and sjavac. It records, for every option, HOW the option
# BEHAVES -- whether it takes a value, whether a repeated occurrence
# overrides an earlier one, and whether it produces a class file.
#
# This is a REFERENCE model, not a configuration file. Nothing reads it
# at run time; scripts/check_capture_options.py reads it and compares it
# with the module's own table (CompilerOption.java), in both
# directions. An option the capture knows and the reference does not has
# to be written down as an addition, so a deliberate extension is
# visible rather than silent.
#
# The categories say what the option DOES, never who modelled it:
#
#   last-instance-only   only the last occurrence counts
#   repeat-allowable     every occurrence applies
#   no-value             the option takes no value
#   repeat-squash        repeatable, but the compiler keeps only one
#   not-compilation      the option does not produce a class file
#   ecj-path             ECJ's own path options
#
# The names are the CANONICAL names -- the name an option is recorded
# under. A compiler spelling that maps onto a canonical name (such as
# -cp onto --classpath) belongs in that option's `aliases` list.

categories:
  last-instance-only:
    - --limit-modules
    - --module
    - --module-source-path
    - --upgrade-module-path
    - --module-path
    - --output-dir
    - --annotation-processing-dir
    - --release
  repeat-allowable:
    - --add-exports
    - --add-reads
    - --patch-module
  no-value:
    - --enable-preview
    - --permit-unidentified-artifacts
    - --permit-sources-without-package
    - -warn:none
  repeat-squash:
    - --add-modules
  not-compilation:
    - -Xprint
    - -proc:only
  ecj-path:
    - bootclasspath
    - extdirs
    - endorseddirs
    - prebootclasspath
    - postbootclasspath
    - --classpath
    - --sourcepath
    - --module-path
    - --module-source-path

options:
  - name: --output-dir
    aliases:
      []
    value: single
    repeat: last-wins
  - name: --classpath
    aliases:
      []
    value: path-list
    repeat: last-wins
  - name: --sourcepath
    aliases:
      []
    value: path-list
    repeat: last-wins
